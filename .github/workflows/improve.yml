# AO Compass 自動改善（自動反映つき）
# 毎時、アプリを少しずつ良くする案を出して、安全なものだけ実装します。
# テストに通ったときだけ main に入り、そのまま公開されます。
# テストが1つでも落ちたら、その回の変更はまるごと捨てられます。
# 作業中にご本人が index.html を直していた場合は、上書きせず、
# ご本人の編集の上に今回の改善を重ねてから、もう一度テストして公開します。
# 同じ場所を両方が直していて合わせられないときだけ、その回を見送ります。
name: AO Compass 自動改善

on:
  schedule:
    - cron: "51 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ao-improve
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 履歴を全部取っておく（あとで本人の編集と突き合わせるため）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 鍵が入っているかを最初に確かめる（入っていないと途中で分かりにくいエラーになる）
      - name: 鍵の確認
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ANTHROPIC_API_KEY が設定されていません。Settings → Secrets and variables → Actions で登録してください。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "鍵あり"

      # 案が尽きてきたら 1日1回だけ動かすモードに落とす
      - id: gate
        run: |
          MODE=hourly
          if [ -f .claude/improve-state.json ] && grep -q '"mode"[[:space:]]*:[[:space:]]*"daily"' .claude/improve-state.json; then
            MODE=daily
          fi
          RUN=yes
          if [ "$MODE" = "daily" ] && [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" != "09" ]; then
            RUN=no
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "hour=$(date -u +%H)" >> "$GITHUB_OUTPUT"
          echo "モード=$MODE 実行=$RUN"

      # 変更前の状態を控えておく（あとで比べるため）
      - name: 変更前を控える
        if: steps.gate.outputs.run == 'yes'
        run: |
          cp index.html /tmp/before.html
          wc -c < index.html > /tmp/before.size
          git rev-parse HEAD > /tmp/before.sha

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          node-version: '22'

      # テスト本体が無ければ、ここで必ず用意する（AIに作らせない）
      - name: テストとブラウザを用意
        if: steps.gate.outputs.run == 'yes'
        run: |
          set -e

          # 公開してはいけないものを除外する
          if [ ! -f .gitignore ]; then
            printf 'node_modules/\npackage.json\npackage-lock.json\ntest-results/\n' > .gitignore
          fi

          mkdir -p tests
          if [ ! -f tests/smoke.mjs ]; then
          cat > tests/smoke.mjs <<'AOSMOKEEOF'
          /* AO Compass 基本動作テスト   使い方: node tests/smoke.mjs */
          import { chromium } from 'playwright';
          import { fileURLToPath } from 'url';
          import path from 'path';

          const HERE = path.dirname(fileURLToPath(import.meta.url));
          const FILE = 'file://' + path.resolve(HERE, '..', 'index.html');
          const EXE = process.env.PW_CHROMIUM || '';

          let pass = 0, fail = 0;
          const ok = (c, m) => { if (c) { pass++; console.log('  PASS', m); } else { fail++; console.log('  FAIL', m); } };

          const browser = await chromium.launch(EXE ? { executablePath: EXE } : {});
          const errors = [];

          async function open() {
            const ctx = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const p = await ctx.newPage();
            p.on('pageerror', e => errors.push(String(e)));
            p.on('console', m => { if (m.type() === 'error' && !/net::|Failed to load resource/.test(m.text())) errors.push(m.text()); });
            await p.addInitScript('window.__AO_NO_ONBOARD=1;');   // 初回の案内を出さない
            await p.goto(FILE);
            await p.waitForTimeout(400);
            return p;
          }

          /* 1. 全画面が開く */
          {
            const p = await open();
            for (const v of ['home', 'schools', 'documents', 'interview', 'tasks', 'portfolio', 'settings']) {
              await p.evaluate(x => go(x), v);
              await p.waitForTimeout(300);
              const n = await p.evaluate(() => document.querySelector('#root').innerText.trim().length);
              ok(n > 20, `${v} 画面が中身つきで開く (${n}文字)`);
            }
            await p.context().close();
          }

          /* 2. 志望校を登録して、書類・タスクまでつながる */
          {
            const p = await open();
            const r = await p.evaluate(() => {
              S.schools = [{ id: 's1', name: '見本大学', faculty: '法学部', deadline: '2026-11-01',
                             docs: '志望理由書、自己推薦書、活動報告書', checklist: {}, tasks: [] }];
              S.documents = []; S.tasks = [];
              save(); render();
              return { req: requiredDocs(S.schools[0]), auto: S.tasks.filter(t => t.docauto).length };
            });
            ok(r.req.length === 3, `必要書類に書いた3件がそのまま出る (${r.req.join('/')})`);
            ok(r.auto === 3, `未着手の3件が緊急タスクになる (${r.auto}件)`);
            await p.evaluate(() => go('documents')); await p.waitForTimeout(400);
            const tx = await p.evaluate(() => document.querySelector('#root').innerText);
            ok(tx.includes('提出書類の取り組み状況'), '書類ページに取り組み状況カードが出る');
            await p.context().close();
          }

          /* 3. チェックを押しても他の行に入らない（同じ座標を4回タップ） */
          {
            const p = await open();
            await p.evaluate(() => {
              S.schools = []; S.documents = [{ id: 'dz', title: 'メモ', type: 'その他', body: 'あ'.repeat(50), status: '下書き', updatedAt: Date.now() }];
              S.tasks = [1, 2, 3, 4, 5].map(i => ({ id: 'x' + i, title: 'とても長いタスク名のサンプルです' + i, due: '2026-08-0' + i, done: false, category: '書類', urgent: i === 1 }));
              save(); go('tasks');
            });
            await p.waitForTimeout(400);
            const box = await p.evaluate(() => { const b = document.querySelector('#root .list-row[data-tid="x1"] .check').getBoundingClientRect(); return { x: b.x + b.width / 2, y: b.y + b.height / 2 }; });
            const h0 = await p.evaluate(() => [...document.querySelectorAll('#root .list-row[data-tid]')].map(x => Math.round(x.getBoundingClientRect().height)).join(','));
            for (let i = 0; i < 4; i++) { await p.mouse.click(box.x, box.y); await p.waitForTimeout(350); }
            const h1 = await p.evaluate(() => [...document.querySelectorAll('#root .list-row[data-tid]')].map(x => Math.round(x.getBoundingClientRect().height)).join(','));
            const st = await p.evaluate(() => S.tasks.map(t => t.done ? 1 : 0).join(''));
            ok(h0 === h1, `完了しても行の高さが変わらない (${h0} / ${h1})`);
            ok(st === '00000', `同じ場所を4回押しても他の行に入らない (${st})`);
            await p.context().close();
          }

          /* 4. 古いデータでも開ける（データを壊していない） */
          {
            const p = await open();
            const okOld = await p.evaluate(() => {
              const old = { schools: [{ id: 'o1', name: '旧データ大学' }], documents: [{ id: 'o2', title: '旧書類', body: 'あ' }], tasks: [{ id: 'o3', title: '旧タスク' }] };
              S = migrate(old); save();
              try { ['home', 'schools', 'documents', 'tasks'].forEach(v => go(v)); return true; } catch (e) { return String(e); }
            });
            ok(okOld === true, `古い形のデータでも全画面が開く (${okOld})`);
            await p.context().close();
          }

          /* 5. 免責表示とバージョン */
          {
            const p = await open();
            const t = await p.evaluate(() => document.body.innerText);
            ok(t.includes('募集要項'), '免責の帯が消えていない');
            const v = await p.evaluate(() => (typeof APP_VER !== 'undefined' ? APP_VER : ''));
            ok(/^\d{4}\.\d{2}\.\d{2}(-\d+)?$/.test(v), `APP_VER の形式が正しい (${v})`);
            await p.context().close();
          }

          console.log(`\n== ${pass} PASS / ${fail} FAIL ==`);
          if (errors.length) { console.log('JSエラー:', errors.slice(0, 5)); }
          await browser.close();
          process.exit(fail || errors.length ? 1 : 0);
          AOSMOKEEOF
          echo "tests/smoke.mjs を新しく用意しました"
          fi

          npm init -y >/dev/null 2>&1 || true
          # ネットワークが不安定な回があるので3回まで試す
          for i in 1 2 3; do npm i -D playwright >/dev/null && break; echo "npm 再試行 $i"; sleep 20; done
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "ブラウザ 再試行 $i"; sleep 20; done

      # AIが触る前に、いまのアプリがテストを通ることを確かめる
      # （もともと落ちているなら、それはAIのせいではないので先に知らせる）
      - name: 変更前テスト
        if: steps.gate.outputs.run == 'yes'
        run: |
          if ! node tests/smoke.mjs; then
            echo "改善する前の時点でテストが落ちています。手で入れた変更のどこかが崩れている可能性があります。この回は何もしませんでした。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.run == 'yes'
        env:
          AO_HOUR: ${{ steps.gate.outputs.hour }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash"
          prompt: |
            あなたはこのリポジトリの開発者です。質問はせず、最後まで自分で進めてください。

            # このアプリについて

            `index.html` 1ファイルだけで動く、日本の総合型選抜（AO入試）向けの受験生用アプリです。
            GitHub Pages で公開されていて、実際の高校生が今この瞬間に使っています。
            あなたの変更はテストに通ればそのまま公開されます。壊さないことが最優先です。

            # 絶対に守ること

            - 単一ファイル。CSSもJSも `index.html` の中に書く。外部ファイルを増やさない（テストは別）。
            - ビルド無し・バニラJS。npmパッケージやフレームワークを本体に持ち込まない。
            - 保存は localStorage。キーは `aoCompass_v1`（ログイン時は `aoCompass_v1__u_<userId>`）。
            - 古いiOS Safariで動くこと。後読み正規表現 `(?<=...)` とオブジェクトスプレッド `{...a}` は使わない。
            - 免責表示を消さない。「入試情報は必ず大学公式サイトの最新の募集要項・原本を確認してください」の帯は常時表示。
            - AIに嘘をつかせない。生徒が経験していないエピソードを作らせない・勝手に補完させない。
              合格を保証する言い回しを出さない。
            - APIキーは利用者自身が入力する方式のまま。開発側のキーをコードに埋め込まない。
              バックアップの書き出しにもキーを含めない。
            - 既存データを壊さない。データ構造を変えるときは `migrate(raw)` に移行処理を足し、
              古いデータでも全画面が開くことを確認する。
            - `.github/` の中のファイルは絶対に変更しない。
            - `node_modules` `package.json` `package-lock.json` には触らない。テスト用の道具です。

            # コードの地図

            - ルート要素は `#root`（`#app` ではない）
            - 画面切り替えは `go(view)` → `render()`
            - 状態はグローバルの `S`（`S.schools` / `S.documents` / `S.tasks` / `S.activities`）
            - 保存は `save()`、画面を作り直すのは `commit(msg)`
            - 志望校の詳細シートは `openSchool(id)`、書類エディタは `openDocEditor(id)`
            - 部品は `el(tag,class,html)` / `esc()` / `fieldText` / `fieldSelect` / `pageHead` / `tgCard` / `confirmDelete`
            - 便利関数は `countJP` `fmtDate` `isoAdd` `todayISO` `daysUntil` `uid` `shortName` `schoolName` `tasksOn`
            - 必要書類まわりは `requiredDocs` / `docProgress` / `docCheckup` / `syncDocTasks` / `docCheckCard`
            - バージョンは `const APP_VER='YYYY.MM.DD'`

            # やりがちな失敗（再発させないこと）

            - チェックを押すと下の行にチェックが入る：完了時に文字数が変わって行の高さが縮み、
              下の行がずり上がるのが原因。バッジは消さずに色だけ変える。
              押した行だけをその場で描き直す（チェックの処理の中で `render()` を呼ばない）。
            - アコーディオンの見出しが右に寄る：`.acc>summary` は `display:flex;justify-content:space-between`。
              見出しは `<span class="smt">` で必ず包む。
            - 閉じた `<details>` の中は `innerText` に出てこない。テストでは `d.open=true` にしてから読む。

            # 今回やること

            ## 1. 担当分野を決める
            環境変数 AO_HOUR（0〜23）を 7 で割った余りで、今回見る場所を決めます。
            0=ホーム 1=志望校 2=提出書類 3=面接・小論文 4=タスク・締切 5=自己分析 6=設定・操作性
            毎回ちがう場所を見ることで、同じ改善を繰り返さないようにします。
            `.claude/improve-log.md` があれば読み、過去にやった改善・見送った案と重複させないこと。

            ## 2. 案を出して選ぶ
            担当分野について、受験生が実際に困る点から改善案を5つ出す。
            「使いやすくする」のような感想は禁止。どの関数のどこをどう変えるかまで具体的に書く。
            そのうちリスクが低く効果が高いものを1〜2個だけ選ぶ。
            データ構造の作り直し・画面の作り直し・外部ライブラリ追加は選ばない。

            ## 3. 実装する
            `index.html` を Edit でピンポイントに直す。全文の書き直しはしない。
            `const APP_VER` を当日の日付（YYYY.MM.DD）に上げる。同じ日に2回目以降なら末尾に -2, -3 と足す。
            **APP_VER を必ず変えること。**変わっていないと、この回の変更はすべて捨てられます。

            ## 4. 検証する（省略不可）
            `tests/smoke.mjs` はすでに用意されています。作り直さないでください。
            - `node tests/smoke.mjs` を通す（全部 PASS になるまで直す）
            - 今回変えた挙動そのものを確かめるテストを `tests/` に1本足して通す
            赤いまま終わらせない。直せない変更は取り消して、残りだけ残す。

            ## 5. 記録する
            `.claude/improve-log.md` の末尾に、日付・担当分野・入れた改善・見送った案を追記する。
            ファイルが無ければ作る。
            さらに `.claude/last-report.md` を新しく書き直し、専門用語なしの日本語で、
            今回入れた改善（各2〜3行、受験生にとって何が変わるか）と、見送った案と理由を書く。

            ## 6. commit も push もしない
            `git commit` も `git push` も `gh pr create` も**しないでください**。
            変更はそのまま置いておくだけで大丈夫です。
            このあとの工程が、テストをもう一度走らせて、通ったときだけ自動で公開します。

            ## 案が尽きてきたとき
            5案すべてが「入れるほどではない」と判断した場合は、`index.html` を一切変えずに終わってください。
            そのうえで `.claude/improve-state.json` を `{"mode":"daily"}` の内容に書き換えてください。
            毎時から1日1回に落ちます。頻度を上げ直すことはしないでください。

      # ここから先は人が書いた確認です。1つでも引っかかったら公開しません。
      - name: 安全確認
        if: steps.gate.outputs.run == 'yes'
        id: check
        run: |
          set -e
          # .github は絶対に変えさせない
          git checkout -- .github 2>/dev/null || true
          git clean -fd .github 2>/dev/null || true

          if cmp -s /tmp/before.html index.html; then
            echo "index.html に変更なし。公開はしません。"
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 免責の帯が残っているか
          grep -q '募集要項' index.html || { echo "NG: 免責の帯が消えている"; exit 1; }

          # バージョンが上がっているか
          NEW=$(grep -o "APP_VER='[^']*'" index.html | head -1)
          OLD=$(grep -o "APP_VER='[^']*'" /tmp/before.html | head -1)
          echo "旧 $OLD → 新 $NEW"
          [ -n "$NEW" ] || { echo "NG: APP_VER が見つからない"; exit 1; }
          [ "$NEW" != "$OLD" ] || { echo "NG: APP_VER が上がっていない"; exit 1; }

          # 極端に増減していないか（壊れた書き換えの検出）
          BEFORE=$(cat /tmp/before.size); AFTER=$(wc -c < index.html)
          echo "サイズ $BEFORE → $AFTER"
          awk -v a="$BEFORE" -v b="$AFTER" 'BEGIN{ if (b < a*0.85 || b > a*1.30) exit 1 }' \
            || { echo "NG: ファイルサイズが極端に変わっている"; exit 1; }

          # 開発側のキーが紛れ込んでいないか
          if grep -qE 'sk-ant-|sk-proj-|service_role' index.html; then
            echo "NG: APIキーらしき文字列が入っている"; exit 1
          fi

          # 最終確認としてテストをもう一度走らせる
          node tests/smoke.mjs

          echo "changed=yes" >> "$GITHUB_OUTPUT"

      - name: 公開する
        if: steps.gate.outputs.run == 'yes' && steps.check.outputs.changed == 'yes'
        run: |
          set -e
          VER=$(grep -o "APP_VER='[^']*'" index.html | head -1 | sed "s/APP_VER='//;s/'//")
          git config user.name "AO Compass Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BASE=$(cat /tmp/before.sha)
          cp index.html /tmp/ours.html

          # 今回できたテストと記録を退避しておく（合流のときに巻き添えで消さないため）
          rm -rf /tmp/keep; mkdir -p /tmp/keep
          if [ -d tests ]; then cp -r tests /tmp/keep/; fi
          if [ -d .claude ]; then cp -r .claude /tmp/keep/; fi
          if [ -f .gitignore ]; then cp .gitignore /tmp/keep/; fi

          DONE=no
          for i in 1 2 3; do
            git fetch -q origin main
            REMOTE=$(git rev-parse origin/main)

            # この回は20〜30分かかります。その間にご本人が index.html を直していることがあります。
            # その場合は上書きせず、ご本人の編集の上に今回の改善を重ねます。
            if [ "$REMOTE" != "$BASE" ]; then
              echo "作業中にご本人の更新がありました。両方を合わせます。"
              git show "$BASE:index.html"   > /tmp/mb.html
              git show "$REMOTE:index.html" > /tmp/mt.html
              cp /tmp/ours.html               /tmp/mo.html
              THEIRVER=$(grep -o "APP_VER='[^']*'" /tmp/mt.html | head -1 | sed "s/APP_VER='//;s/'//")

              # バージョンの行は必ずぶつかるので、いったん共通の目印にそろえてから合わせる
              sed -i "s/APP_VER='[^']*'/APP_VER='__AOVER__'/" /tmp/mb.html /tmp/mt.html /tmp/mo.html

              if ! git merge-file -q /tmp/mo.html /tmp/mb.html /tmp/mt.html; then
                echo "今回は見送りました。ご本人が直したのと同じ場所を改善しようとしたため、自動では合わせられません。アプリはご本人の版のままです。" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi

              # ご本人がつけた番号と同じにならないようにする
              NEW="$VER"; D=$(echo "$VER" | cut -d- -f1); k=2
              while [ "$NEW" = "$THEIRVER" ]; do NEW="$D-$k"; k=$((k+1)); done
              sed -i "s/APP_VER='__AOVER__'/APP_VER='$NEW'/" /tmp/mo.html
              VER="$NEW"

              # ご本人の最新の上に載せ直す
              git checkout -q -f "$REMOTE"
              cp /tmp/mo.html index.html
              if [ -d /tmp/keep/tests ]; then cp -r /tmp/keep/tests .; fi
              if [ -d /tmp/keep/.claude ]; then cp -r /tmp/keep/.claude .; fi
              if [ -f /tmp/keep/.gitignore ] && [ ! -f .gitignore ]; then cp /tmp/keep/.gitignore .; fi
              cp index.html /tmp/ours.html
              BASE="$REMOTE"

              # 合わせた結果を、もう一度ぜんぶ確認する。ここが命綱です。
              GIVEUP=""
              grep -q '募集要項' index.html || GIVEUP="免責の帯が消えた"
              grep -q "APP_VER='$VER'" index.html || GIVEUP="バージョンが入らなかった"
              if grep -qE 'sk-ant-|sk-proj-|service_role' index.html; then GIVEUP="キーらしき文字列が出た"; fi
              A=$(wc -c < /tmp/mt.html); B=$(wc -c < index.html)
              awk -v a="$A" -v b="$B" 'BEGIN{ if (b < a*0.85 || b > a*1.30) exit 1 }' || GIVEUP="大きさが極端に変わった"
              if [ -z "$GIVEUP" ] && ! node tests/smoke.mjs; then GIVEUP="テストが落ちた"; fi
              if [ -n "$GIVEUP" ]; then
                echo "合わせた結果に問題（$GIVEUP）があったので、今回は公開を見送りました。アプリはご本人の版のままです。" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "ご本人の編集と今回の改善を合わせました。"
            fi

            # 公開するのはこの4つだけ。node_modules などは絶対に入れない。
            git add index.html
            git add .gitignore || true
            git add tests || true
            git add .claude || true
            git status --short
            if git diff --cached --quiet; then
              echo "公開するものがありませんでした。"
              exit 0
            fi
            git commit -q -m "自動改善 $VER"

            if git push origin HEAD:main; then
              echo "公開しました: $VER"
              echo "公開しました: $VER" >> "$GITHUB_STEP_SUMMARY"
              DONE=yes
              break
            fi

            echo "押し込みに失敗。少し待って再試行 $i"
            git reset -q --soft HEAD~1   # 次の周回でやり直せるように戻す
            sleep 10
          done

          if [ "$DONE" != "yes" ]; then
            echo "3回試しましたが公開できませんでした。次の回にやり直します。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # 何が起きたかを Actions の画面に日本語で残す
      - name: 結果を書く
        if: always()
        run: |
          {
            echo ""
            echo "- 実行モード: ${{ steps.gate.outputs.run }}（時刻 ${{ steps.gate.outputs.hour }}時 UTC）"
            echo "- index.html の変更: ${{ steps.check.outputs.changed || '（そこまで進みませんでした）' }}"
          } >> "$GITHUB_STEP_SUMMARY"
          # AIがうまく動かなかったとき、その理由をここに出す（ログを探さなくて済むように）
          LOG=/home/runner/work/_temp/claude-execution-output.json
          if [ -f "$LOG" ]; then
            MSG=$(node -e '
              try {
                const a = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                const list = Array.isArray(a) ? a : [a];
                const hit = list.reverse().find(x => x && (x.is_error || x.error));
                if (hit) console.log(JSON.stringify(hit.error || hit.result || hit).slice(0, 800));
              } catch (e) {}
            ' "$LOG" 2>/dev/null || true)
            if [ -n "$MSG" ]; then
              { echo ""; echo "### AIが止まった理由"; echo '```'; echo "$MSG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ -f .claude/last-report.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat .claude/last-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
