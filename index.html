<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3b57">
<title>AO Compass｜総合型選抜の伴走アプリ</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#eef1f4; --line:#e2e6eb;
  --ink:#1f2933; --ink-2:#556070; --ink-3:#8792a2;
  --navy:#1f3b57; --navy-2:#2c5478; --teal:#128f8b; --teal-soft:#e2f3f2;
  --orange:#e8873b; --orange-soft:#fdefe1;
  --ok:#2e8b57; --ok-soft:#e6f4ec; --warn:#c9772a; --warn-soft:#fbeede; --alert:#b4573f;
  --shadow:0 1px 2px rgba(31,41,51,.06),0 6px 20px rgba(31,41,51,.06);
  --radius:16px; --radius-s:11px;
  --font:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',Meiryo,system-ui,sans-serif;
  --maxw:960px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); color:var(--ink); background:var(--bg);
  line-height:1.7; font-size:15px; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.4}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px}
a{color:var(--teal)}

/* ---------- Layout ---------- */
.app{max-width:var(--maxw);margin:0 auto}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--navy);letter-spacing:.02em}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--navy),var(--teal));position:relative;flex:none}
.brand .logo::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid #fff;border-top-color:var(--orange);transform:rotate(35deg)}
.brand small{display:block;font-weight:600;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.topbar .spacer{flex:1}
.disclaimer{
  background:var(--navy);color:#dfe9f1;font-size:11.5px;line-height:1.55;
  padding:7px 16px;text-align:center;letter-spacing:.01em
}
.disclaimer b{color:#fff}

.view{padding:16px 16px 8px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 14px}
.page-head h2{font-size:20px}
.page-head p{margin:2px 0 0;color:var(--ink-2);font-size:12.5px}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card.tight{padding:13px}
.card h3{font-size:15px}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-title .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);flex:none;font-size:16px}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.xsmall{font-size:11.5px}
.grid{display:grid;gap:12px}
@media(min-width:620px){.grid.cols-2{grid-template-columns:1fr 1fr}.grid.cols-3{grid-template-columns:repeat(3,1fr)}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);border-radius:11px;padding:10px 15px;font-size:14px;font-weight:600;transition:.15s}
.btn:hover{border-color:#cfd6de;background:#fbfcfd}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.teal:hover{filter:brightness(1.05)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.btn.danger{color:var(--alert);border-color:#e8cfc8}
.btn.danger:hover{background:#fbf1ee}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chip:focus-visible{outline:3px solid var(--teal-soft);outline-offset:2px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Chips / tags / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);color:var(--ink-2);
  border:1px solid transparent;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.chip.sel{background:var(--teal-soft);color:var(--teal);border-color:#bfe6e4}
.chip.click{cursor:pointer}
.chip.click:hover{border-color:#cfd6de}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}
.badge.navy{background:#e7edf3;color:var(--navy)}
.badge.teal{background:var(--teal-soft);color:var(--teal)}
.badge.orange{background:var(--orange-soft);color:var(--orange)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.alert{background:#f7e7e2;color:var(--alert)}
.badge.grey{background:var(--surface-2);color:var(--ink-2)}
.pill-priority{font-weight:800}

/* ---------- Progress ---------- */
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog>span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--navy-2));border-radius:99px;transition:width .4s}
.ring{--p:0;--c:var(--teal);width:56px;height:56px;border-radius:50%;flex:none;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center}
.ring>i{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;color:var(--navy)}

/* ---------- Countdown ---------- */
.countdown{display:flex;align-items:center;gap:14px}
.countdown .num{font-size:34px;font-weight:800;color:var(--navy);line-height:1}
.countdown.soon .num{color:var(--orange)}
.countdown.urgent .num{color:var(--alert)}

/* ---------- Forms ---------- */
.field{margin-bottom:12px}
.field>label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field .hint{font-weight:500;color:var(--ink-3);font-size:11.5px}
.input,textarea.input,select.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;color:var(--ink)}
textarea.input{resize:vertical;min-height:80px;line-height:1.7}
.input:focus,textarea.input:focus,select.input:focus{border-color:var(--teal)}
.row2{display:grid;gap:12px}
@media(min-width:560px){.row2{grid-template-columns:1fr 1fr}}
.counter{text-align:right;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.counter.over{color:var(--alert);font-weight:700}
.counter.near{color:var(--warn)}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:30px 18px;color:var(--ink-2)}
.empty .em{font-size:30px;margin-bottom:8px}
.empty h4{font-size:15px;color:var(--ink);margin-bottom:4px}

/* ---------- Bottom nav ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-inner{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:none;background:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-3);font-size:10.5px;font-weight:700}
.tab .ic{font-size:20px;line-height:1}
.tab.active{color:var(--navy)}
.tab.active .ic{transform:translateY(-1px)}

/* ---------- Modal / drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,28,38,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:var(--maxw);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:slideup .25s ease}
@media(min-width:620px){.overlay{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
@keyframes slideup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;position:sticky;top:-16px;background:var(--surface);padding-top:4px}
.sheet-head h3{font-size:17px}
.x{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:17px;color:var(--ink-2);flex:none}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:80;opacity:0;
  box-shadow:0 8px 24px rgba(0,0,0,.2);transition:.28s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--ok)}.toast.warn{background:var(--warn)}.toast.err{background:var(--alert)}

/* ---------- Lists ---------- */
.list-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:none}
.check{width:22px;height:22px;border-radius:7px;border:2px solid #cbd3dc;flex:none;display:grid;place-items:center;cursor:pointer;background:#fff;margin-top:2px}
.check.on{background:var(--teal);border-color:var(--teal);color:#fff}
.strike{text-decoration:line-through;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0}

.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.searchbar{display:flex;gap:8px;margin-bottom:12px}
.searchbar .input{flex:1}

.note{background:var(--warn-soft);border:1px solid #f0dcc2;color:#7a5320;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6}
.note.info{background:var(--teal-soft);border-color:#c7e7e5;color:#0f6f6b}
.ai-note{background:var(--surface-2);border-left:3px solid var(--teal);border-radius:8px;padding:9px 11px;font-size:12px;color:var(--ink-2)}

.hl-weak{background:#fdeede;border-bottom:2px solid var(--orange);border-radius:3px;padding:0 1px}
.diff-del{background:#fbe9e4;color:#9c4a34;text-decoration:line-through;border-radius:3px;padding:0 2px}
.diff-add{background:#e6f4ec;color:#1f6b43;border-radius:3px;padding:0 2px}

.scorebar{display:flex;align-items:center;gap:9px;margin:7px 0}
.scorebar .lbl{width:78px;font-size:12px;font-weight:700;color:var(--ink-2);flex:none}
.scorebar .track{flex:1;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.scorebar .track>span{display:block;height:100%;border-radius:99px;background:var(--teal)}
.scorebar .val{width:30px;text-align:right;font-size:12px;font-weight:800;color:var(--navy);flex:none}

.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;background:#fbfcfd}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"⌄";color:var(--ink-3);transition:.2s}
.acc[open]>summary::after{transform:rotate(180deg)}
.acc .acc-body{padding:0 14px 14px}

.tag-sm{display:inline-block;background:var(--surface-2);color:var(--ink-2);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600;margin:2px 3px 0 0}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-tile{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.menu-tile .em{font-size:22px}
.menu-tile b{display:block;margin-top:6px;font-size:14px}
.menu-tile span{font-size:11.5px;color:var(--ink-2)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--teal);animation:spin .8s linear infinite;margin:14px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px var(--ok-soft)}

/* ---------- Autocomplete ---------- */
.ac-wrap{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:70;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 26px rgba(20,28,38,.16);max-height:270px;overflow:auto}
.ac-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-size:14px;border-top:1px solid var(--surface-2)}
.ac-item:first-child{border-top:none}
.ac-item:hover,.ac-item.ac-active{background:var(--teal-soft)}
.ac-item .nm{font-weight:600}
.ac-more{padding:8px 12px;font-size:11.5px;color:var(--ink-3);text-align:center;border-top:1px solid var(--surface-2)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="logo" aria-hidden="true"></span>
        <span>AO Compass<small>総合型選抜の伴走アプリ</small></span>
      </div>
      <div class="spacer"></div>
      <button class="btn sm ghost" id="btnAuth" aria-label="アカウント" style="display:none">☁️ ログイン</button>
      <button class="btn sm ghost" id="btnMore" aria-label="データと設定">⚙️</button>
    </div>
  </header>
  <div class="disclaimer" role="note">
    ⚠️ <b>入試情報は必ず大学公式サイトの最新の募集要項・原本を確認してください。</b>AIの抽出・アドバイスは参考情報で、出願条件や合否を保証しません。
  </div>

  <main id="root" aria-live="polite"></main>
</div>

<nav class="tabbar" aria-label="メインナビゲーション">
  <div class="tabbar-inner">
    <button class="tab" data-tab="home"><span class="ic" aria-hidden="true">🏠</span>ホーム</button>
    <button class="tab" data-tab="schools"><span class="ic" aria-hidden="true">🎓</span>志望校</button>
    <button class="tab" data-tab="documents"><span class="ic" aria-hidden="true">📝</span>書類</button>
    <button class="tab" data-tab="interview"><span class="ic" aria-hidden="true">🎤</span>面接</button>
    <button class="tab" data-tab="more"><span class="ic" aria-hidden="true">⋯</span>その他</button>
  </div>
</nav>

<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* =========================================================================
   AO Compass — 単一HTML / localStorage / ルールベースAI (デモ)
   ========================================================================= */
const LS_KEY='aoCompass_v1';
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const todayISO=()=>new Date().toISOString().slice(0,10);
function daysUntil(iso){ if(!iso) return null; const d=new Date(iso+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }
function countJP(s){ return (s||'').replace(/\s/g,'').length; } // 空白を除く文字数

/* ---------------- State ---------------- */
let S=load();
function blankState(){ return {
  meta:{primarySchoolId:null, demoLoaded:false},
  schools:[], activities:[], documents:[], interview:[], essays:[], tasks:[], feedback:[],
  self:{answers:{}, tags:{strengths:[],values:[],activities:[],themes:[],future:[],episodes:[]}},
  story:{origin:'',problem:'',past:'',learned:'',wantLearn:'',whyUniv:'',afterEnroll:'',future:''}
};}
function load(){ try{const r=localStorage.getItem(LS_KEY);if(r)return Object.assign(blankState(),JSON.parse(r));}catch(e){} return blankState(); }
function save(){ try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){toast('保存に失敗しました（容量制限の可能性）','err');} scheduleCloudPush(); }
function commit(msg){ save(); if(msg)toast(msg,'ok'); render(); }

/* =========================================================================
   クラウド保存・ログイン（Supabase）— 別端末でも同じアカウントで続きから
   ========================================================================= */
const SB_URL='https://zamkhvvylqbvwijnkayp.supabase.co';
const SB_ANON='sb_publishable_mZ9GCbvJvbgefBKxgF9T1w_5H4PVFjS';
function cloudConfigured(){ return /^https?:\/\//.test(SB_URL) && typeof SB_ANON==='string' && SB_ANON.length>20; }
let sb=null, sbUser=null, sbStatus='guest', sbSyncTimer=null;
function initCloud(){
  if(!cloudConfigured() || !window.supabase){ updateAuthBar(); return; }
  try{ sb=window.supabase.createClient(SB_URL,SB_ANON); }catch(e){ return; }
  sb.auth.getSession().then(({data})=>{ if(data&&data.session){ onAuth(data.session.user); } updateAuthBar(); });
  sb.auth.onAuthStateChange((_e,session)=>{ if(session){ if(!sbUser||sbUser.id!==session.user.id) onAuth(session.user); } else { sbUser=null; sbStatus='guest'; } updateAuthBar(); });
  updateAuthBar();
}
function onAuth(u){ sbUser=u; sbStatus='synced'; updateAuthBar(); cloudPull(); }
async function cloudPull(){
  if(!sb||!sbUser) return;
  try{
    const {data,error}=await sb.from('app_state').select('data').eq('user_id',sbUser.id).maybeSingle();
    if(error){ sbStatus='error'; updateAuthBar(); return; }
    if(data&&data.data){ S=Object.assign(blankState(),data.data); localStorage.setItem(LS_KEY,JSON.stringify(S)); sbStatus='synced'; render(); toast('クラウドから読み込みました','ok'); }
    else { await cloudPush(); }
  }catch(e){ sbStatus='error'; updateAuthBar(); }
}
async function cloudPush(){
  if(!sb||!sbUser) return;
  sbStatus='syncing'; updateAuthBar();
  try{
    const {error}=await sb.from('app_state').upsert({user_id:sbUser.id, data:S, updated_at:new Date().toISOString()});
    sbStatus=error?'error':'synced';
  }catch(e){ sbStatus='error'; }
  updateAuthBar();
}
function scheduleCloudPush(){ if(!sb||!sbUser) return; sbStatus='pending'; updateAuthBar(); clearTimeout(sbSyncTimer); sbSyncTimer=setTimeout(cloudPush,1500); }
function updateAuthBar(){
  const b=document.getElementById('btnAuth'); if(!b) return;
  if(!cloudConfigured()){ b.style.display='none'; return; }
  b.style.display='';
  if(sbUser){ const nm=(sbUser.email||'').split('@')[0]; const st=(sbStatus==='syncing'||sbStatus==='pending')?'同期中…':sbStatus==='error'?'⚠同期エラー':'同期済'; b.textContent='☁️ '+nm.slice(0,8); b.title=sbUser.email+'（'+st+'）'; }
  else { b.textContent='☁️ ログイン'; b.title='ログイン / 新規登録'; }
}
function jpAuthErr(e){ const m=((e&&e.message)||'').toLowerCase(); if(m.includes('invalid login'))return 'メールアドレスかパスワードが違います。'; if(m.includes('already registered')||m.includes('already been'))return 'このメールは登録済みです。ログインしてください。'; if(m.includes('confirm'))return 'メール確認が必要です。受信メールのリンクを開いてからログインしてください。'; if(m.includes('password'))return 'パスワードは6文字以上にしてください。'; if(m.includes('rate'))return '試行が多すぎます。少し待って再度お試しください。'; return '失敗しました：'+((e&&e.message)||''); }
function openAuthSheet(){

/* =========================================================================
   ルールベースAIコーチ（デモ）— 捏造せず、本人の言葉を引き出す方針
   ========================================================================= */
const ABSTRACT_WORDS=['さまざま','様々','いろいろな','色々','たくさん','多くの','しっかり','ちゃんと','頑張った','がんばった','努力した','成長した','コミュニケーション能力','リーダーシップ','主体性','積極的に','一生懸命','貢献したい','役に立ちたい','興味がある','学びたい','グローバル','社会に','貢献','責任感','協調性'];
const FILLER=['と思います','だと思う','のようなもの','など','といった','的な'];
function hasNumbers(t){ return /[0-9０-９]+(人|名|回|時間|日|週間|ヶ月|か月|年|％|%|位|件|校|組|冊|万|千|点|部)/.test(t); }
function detectAbstract(t){ return ABSTRACT_WORDS.filter(w=>t.includes(w)); }
function firstPerson(t){ return /(私は|自分は|私が|自分が|担当し|提案し|企画し|作成し|交渉し|呼びかけ|巻き込)/.test(t); }

/* テキストを設問・大学情報に照らして分析し、8観点スコア＋指摘＋質問を返す */
function analyzeText(text, ctx={}){
  const t=(text||'').trim(); const len=countJP(t);
  const limit=ctx.charLimit||0;
  const abs=detectAbstract(t);
  const num=hasNumbers(t);
  const fp=firstPerson(t);
  const school=ctx.school||null;
  const univName=school?school.name:'';
  const mentionsUniv=univName&&t.includes(univName.replace(/大学$/,''));
  const sentences=t.split(/[。\n]/).filter(s=>s.trim().length>0);
  const longSent=sentences.filter(s=>countJP(s)>70);
  // repetition
  const words={}; (t.match(/[一-龯ァ-ヶ]{2,}/g)||[]).forEach(w=>words[w]=(words[w]||0)+1);
  const repeated=Object.entries(words).filter(([w,c])=>c>=4&&w.length>=3).map(([w])=>w).slice(0,3);

  const scores={
    具体性: clamp( (num?35:10)+(fp?25:5)+Math.min(30,len/8) - abs.length*4 ),
    一貫性: clamp( 55 + (ctx.storyLinked?15:0) - (longSent.length*4) ),
    独自性: clamp( (mentionsUniv?40:12)+(num?15:5)+ (t.includes('だからこそ')||t.includes('この大学')?15:0) - abs.length*3 ),
    志望校との接続: clamp( (mentionsUniv?45:10)+(ctx.hasPolicy&&t.length>60?20:8)+(school&&school.faculty&&t.includes(school.faculty.replace(/学部$/,''))?15:0) ),
    論理性: clamp( 50 + (/(なぜなら|理由は|そのため|だから|よって|一方|しかし)/.test(t)?18:-6) - longSent.length*4 ),
    読みやすさ: clamp( 70 - longSent.length*8 - (repeated.length*5) ),
    設問への適合: clamp( ctx.question ? (relevanceToQuestion(t,ctx.question)) : (len>30?60:30) ),
    本人らしさ: clamp( (fp?35:8)+(num?18:6)+(ctx.usesEpisode?15:0) - abs.length*4 )
  };
  // findings
  const findings=[];
  if(limit && len>limit) findings.push({sev:'must',title:`指定文字数を超えています（${len}/${limit}字）`,why:'指定文字数超過は形式不備として減点・受理されない場合があります。',how:`約${len-limit}字を削ります。抽象的な説明文から削ると内容を保てます。`});
  else if(limit && len<Math.floor(limit*0.6)) findings.push({sev:'check',title:`文字数が少なめです（${len}/${limit}字）`,why:'指定量に対して情報が不足し、説得力が弱く見える可能性があります。',how:'具体的な出来事・数字・あなたの行動を1つ足せます。'});
  if(!num) findings.push({sev:'important',title:'具体的な数字・固有名詞が見当たりません',why:'「頑張った」規模が読み手に伝わらず、印象に残りにくくなります。',how:'例：「約120人が来場」「3か月間」「週2回」など、規模や期間を入れられますか？',q:'その活動を数字で表すと、どのくらいの規模・期間・回数でしたか？'});
  if(!fp) findings.push({sev:'important',title:'「あなた自身が何をしたか」が読み取りにくいです',why:'面接で「実際にあなたは何を?」と必ず問われます。集団の成果と個人の行動を分けて書きましょう。',how:'「私は〇〇を提案し、△△を担当した」の形で主語をあなたにできますか？',q:'その中で、あなた自身が具体的に決めた・動いたことは何ですか？'});
  if(abs.length>=3) findings.push({sev:'important',title:`抽象的な表現が多めです（${abs.slice(0,4).map(esc).join('・')} など）`,why:'誰にでも当てはまる言葉は、あなたらしさや説得力を弱めます。',how:'抽象語を、それを裏づける具体的なエピソード1つに置き換えられますか？',q:'「'+esc(abs[0])+'」と感じた具体的な場面を1つ挙げるとしたら？'});
  if(univName && !mentionsUniv) findings.push({sev:'important',title:`「なぜこの大学・学部なのか」が弱い可能性`,why:'他大学でも成り立つ内容だと、志望度が伝わりにくくなります。',how:`${esc(univName)}ならではの学び（ゼミ・カリキュラム・研究）に触れられますか？`,q:'他の大学ではなく、この大学でなければならない理由は何ですか？'});
  if(longSent.length) findings.push({sev:'check',title:`一文が長い箇所があります（${longSent.length}か所）`,why:'一文が長いと主語と述語の関係が読み取りにくくなります。',how:'70字を超える文を2文に分けると読みやすくなります。'});
  if(repeated.length) findings.push({sev:'check',title:`同じ語の繰り返し（${repeated.map(esc).join('・')}）`,why:'同語反復は内容の薄さや単調さの印象につながります。',how:'言い換えるか、重複部分を1つにまとめられます。'});

  const priorities=findings.filter(f=>f.sev!=='check').slice(0,3);
  const nextActions=priorities.length?priorities.map(f=>f.title):['大きな問題は見つかりませんでした。声に出して読み、詰まる箇所を微調整しましょう。'];
  const rewrites=abs.length?buildRewrites(t,abs):[];
  return {len,scores,findings,priorities,nextActions,rewrites,highlights:{abstract:abs,longSent}};
}
function relevanceToQuestion(t,q){
  const keys=(q.match(/[一-龯]{2,}/g)||[]).filter(w=>!['理由','説明','記述','以内','述べ','あなた','ください'].includes(w));
  if(!keys.length) return 55; let hit=0; keys.forEach(k=>{if(t.includes(k))hit++;});
  return 35+Math.round((hit/keys.length)*55);
}
function buildRewrites(t){
  // デモ用: 実際の書き換えはせず「方向性」を提示（本人が編集する前提）
  return [
    {mode:'具体性重視',text:'（例）「◯◯活動に力を入れた」→「◯◯活動で、△△という課題に対し、私は□□を提案し、3か月で参加者を約2倍にした」のように、課題・自分の行動・結果を数字で。'},
    {mode:'簡潔',text:'（例）修飾語や「〜だと思います」を削り、一文一義に。結論→理由→具体例の順に並べ替える。'},
    {mode:'本人らしさ重視',text:'（例）その時あなたが実際に感じた迷いや気づきを一言添えると、体験の手触りが出ます。'}
  ];
}
function clamp(n){ return Math.max(0,Math.min(100,Math.round(n))); }

/* 書類間の一貫性チェック（登録データを横断） */
function consistencyCheck(){
  const issues=[];
  const bodies=S.documents.map(d=>d.body||'');
  const allText=bodies.join('\n')+'\n'+Object.values(S.self.answers||{}).join('\n')+'\n'+S.interview.map(i=>i.answer||'').join('\n');
  // 志望校言及
  const primary=S.schools.find(s=>s.id===S.meta.primarySchoolId);
  if(primary && S.documents.length){
    const short=primary.name.replace(/大学$/,'');
    const missing=S.documents.filter(d=>d.body&&!d.body.includes(short));
    if(missing.length) issues.push({sev:'important',text:`第一志望「${esc(primary.name)}」の固有の理由が書かれていない書類があります（${missing.map(d=>esc(d.title)).join('、')}）。`});
  }
  // 数値の食い違い（活動名が複数書類に出るのに数字が異なる例の簡易検出）
  S.activities.forEach(a=>{
    const usedIn=S.documents.filter(d=>d.body&&a.name&&d.body.includes(a.name.slice(0,4)));
    if(usedIn.length>=2){
      const nums=usedIn.map(d=>(d.body.match(/[0-9０-９]+/g)||[]).join(','));
      if(new Set(nums).size>1) issues.push({sev:'check',text:`活動「${esc(a.name)}」が複数書類に登場します。期間や人数などの数値が一致しているか確認しましょう。`});
    }
  });
  // 強みのばらつき
  const strengths=(S.self.tags.strengths||[]);
  if(strengths.length>4) issues.push({sev:'check',text:`自己分析の「強み」が${strengths.length}個あります。書類ごとに主張する強みがばらつかないよう、中心となる強みを1〜2個に絞ると一貫性が出ます。`});
  if(!issues.length) issues.push({sev:'ok',text:'現時点で大きな矛盾は検出されませんでした。数値・固有名詞・主張する強みが書類間で揃っているか、提出前に自分の目でも確認しましょう。'});
  return issues;
}

/* 提出書類から面接想定質問を生成 */
function genInterviewQuestions(doc){
  const qs=[]; const t=doc.body||'';
  qs.push({cat:'志望理由の深掘り',q:'この書類で書いた志望理由を、1分で口頭で説明してください。'});
  if(hasNumbers(t)) qs.push({cat:'事実確認',q:'文中の数字（規模・期間など）について、もう少し詳しく教えてください。'});
  qs.push({cat:'本人の役割',q:'その活動で、あなた自身が具体的に担当したことは何ですか？'});
  qs.push({cat:'学び・成長',q:'その経験の前と後で、あなたの考え方はどう変わりましたか？'});
  qs.push({cat:'大学での計画',q:'入学後、その関心をどのゼミ・科目でどう深めたいですか？'});
  qs.push({cat:'将来像',q:'その学びを、将来どのように生かしたいですか？'});
  if(detectAbstract(t).length>=2) qs.push({cat:'説明不足の確認',q:'「'+esc(detectAbstract(t)[0])+'」とありますが、具体的にはどういうことですか？'});
  qs.push({cat:'厳しめ',q:'同じ内容は他大学でも言えそうですが、なぜ本学なのですか？'});
  return qs;
}

function pageHead(title,sub,actionBtn){
  const h=el('div','page-head'); const left=el('div'); left.appendChild(el('h2',null,esc(title))); if(sub)left.appendChild(el('p',null,esc(sub))); h.appendChild(left); if(actionBtn)h.appendChild(actionBtn); return h;
}
function emptyState(em,title,msg,btn){
  const e=el('div','empty'); e.innerHTML=`<div class="em">${em}</div><h4>${esc(title)}</h4><p class="small">${esc(msg)}</p>`; if(btn){const w=el('div');w.style.marginTop='12px';w.appendChild(btn);e.appendChild(w);} return e;
}
function priorityBadge(p){ if(!p) return ''; const cls=p==1?'orange':p==2?'teal':'grey'; return `<span class="badge ${cls} pill-priority">第${p}志望</span>`; }
function schoolProgress(s){
  const cl=s.checklist||{}; const keys=['req','gpa','doc_ao','doc_katsu','eng','photo','web','fee','mail','mensetsu'];
  const done=keys.filter(k=>cl[k]).length; return Math.round(done/keys.length*100);
}
function countdownBox(iso){
  const dd=daysUntil(iso); const box=el('div','countdown '+(dd!=null&&dd<=14?'urgent':dd!=null&&dd<=30?'soon':''));
  if(dd==null){ box.innerHTML='<div><div class="num">—</div><div class="small muted">締切未設定</div></div>'; return box; }
  box.innerHTML=`<div><div class="num">${dd<0?'締切済':dd}</div>${dd>=0?'<div class="small muted">日</div>':''}</div><div class="small muted">出願締切<br>${fmtDate(iso)}</div>`;
  return box;
}
function schoolName(id){ const s=S.schools.find(x=>x.id===id); return s?s.name:''; }

function homeAdvice(primary){
  const dd=primary?daysUntil(primary.deadline):null;
  const draft=S.documents.find(d=>d.status!=='完成');
  const bits=[];
  if(dd!=null&&dd>=0&&dd<=30) bits.push(`出願まで残り<b>${dd}日</b>です。今週は書類の推敲と面接練習に集中しましょう。`);
  if(draft){ const a=analyzeText(draft.body,{charLimit:draft.charLimit,school:S.schools.find(s=>s.id===draft.schoolId),question:draft.question}); if(a.priorities.length) bits.push(`「${esc(draft.title)}」は、まず<b>${esc(a.priorities[0].title)}</b>から直すと良さそうです。`); }
  if(!bits.length) bits.push('経験の棚卸し（自己分析・活動実績）が、書類と面接の土台になります。少しずつ言葉にしていきましょう。');
  bits.push('※AIは合否を判断しません。最後は必ずあなた自身の言葉で確認してください。');
  return bits.join('<br>');
}

function schoolTypeLabel(t){return t==='国'?'国立':t==='公'?'公立':t==='私'?'私立':'';}
function fieldSchoolName(label,val){
  const f=el('div','field'); const id='f'+uid();
  f.innerHTML=`<label for="${id}">${esc(label)} <span class="hint">1文字入れると候補が出ます。リストに無い学校（専門学校など）はそのまま入力できます</span></label>`;
  const wrap=el('div','ac-wrap');
  const inp=el('input','input'); inp.id=id; inp.type='text'; inp.value=val||''; inp.autocomplete='off'; inp.setAttribute('role','combobox'); inp.setAttribute('aria-autocomplete','list'); inp.setAttribute('aria-expanded','false');
  const list=el('div','ac-list'); list.style.display='none'; list.setAttribute('role','listbox');
  wrap.append(inp,list); f.appendChild(wrap);
  let matches=[], active=-1;
  const close=()=>{ list.style.display='none'; inp.setAttribute('aria-expanded','false'); active=-1; };
  const draw=()=>{ const q=inp.value.trim(); list.innerHTML=''; active=-1;
    if(!q){ close(); return; }
    matches=SCHOOL_DB.filter(s=>s.n.indexOf(q)>=0);
    const shown=matches.slice(0,40);
    if(!shown.length){ close(); return; }
    shown.forEach((s,i)=>{ const it=el('div','ac-item'); it.setAttribute('role','option'); it.innerHTML=`<span class="nm">${esc(s.n)}</span><span class="badge grey">${esc(schoolTypeLabel(s.t))}</span>`; it.onmousedown=e=>{ e.preventDefault(); inp.value=s.n; close(); inp.dispatchEvent(new Event('change')); }; list.appendChild(it); });
    if(matches.length>shown.length){ const m=el('div','ac-more',`ほか${matches.length-shown.length}件…もう少し入力すると絞り込めます`); list.appendChild(m); }
    list.style.display=''; inp.setAttribute('aria-expanded','true');
  };
  inp.addEventListener('input',draw);
  inp.addEventListener('focus',()=>{ if(inp.value.trim())draw(); });
  inp.addEventListener('blur',()=>setTimeout(close,150));
  inp.addEventListener('keydown',e=>{ if(list.style.display==='none')return; const items=[...list.querySelectorAll('.ac-item')];
    if(e.key==='ArrowDown'){ e.preventDefault(); active=Math.min(active+1,items.length-1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); active=Math.max(active-1,0); }
    else if(e.key==='Enter'){ if(active>=0){ e.preventDefault(); inp.value=matches[active].n; close(); return; } }
    else if(e.key==='Escape'){ close(); return; } else return;
    items.forEach((it,i)=>it.classList.toggle('ac-active',i===active)); if(active>=0&&items[active])items[active].scrollIntoView({block:'nearest'});
  });
  f.get=()=>inp.value.trim(); f._input=inp; return f;
}

function suggestSelfTags(){

async function callAI(system,user,opts={}){
  if(typeof window!=='undefined'&&window.__AO_AI_MOCK) return await window.__AO_AI_MOCK(system,user,opts);
  if(!aiReady()) throw new Error('AIが未接続です。設定でAPIキーを登録してください。');
  const prov=AICFG.provider; const controller=new AbortController();
  const to=setTimeout(()=>controller.abort(),70000);
  try{
    if(prov==='anthropic'){
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:controller.signal,
        headers:{'content-type':'application/json','x-api-key':AICFG.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:AICFG.model||defaultModel('anthropic'),max_tokens:opts.max||1800,system,messages:[{role:'user',content:user}]})});
      if(!res.ok) throw new Error(await friendlyErr(res));
      const d=await res.json(); return (d.content||[]).map(c=>c.text||'').join('').trim();
    } else {
      const base=(AICFG.baseURL||'https://api.openai.com/v1').replace(/\/+$/,'');
      const body={model:AICFG.model||defaultModel('openai'),messages:[{role:'system',content:system},{role:'user',content:user}]};
      if(opts.json) body.response_format={type:'json_object'};
      const res=await fetch(base+'/chat/completions',{method:'POST',signal:controller.signal,
        headers:{'content-type':'application/json','authorization':'Bearer '+AICFG.key},body:JSON.stringify(body)});
      if(!res.ok) throw new Error(await friendlyErr(res));
      const d=await res.json(); return (d.choices&&d.choices[0]&&d.choices[0].message.content||'').trim();
    }
  }catch(e){ if(e.name==='AbortError') throw new Error('応答がタイムアウトしました。通信環境を確認して再試行してください。'); throw e; }
  finally{ clearTimeout(to); }
}
async function friendlyErr(res){ let t=''; try{t=await res.text();}catch(e){}
  if(res.status===401||res.status===403) return 'APIキーが正しくないか、権限がありません（'+res.status+'）。設定を確認してください。';
  if(res.status===429) return '利用上限に達したか、混雑しています（429）。少し待って再試行してください。';
  if(res.status===404) return 'モデル名またはエンドポイントが見つかりません（404）。モデル名を確認してください。';
  if(res.status===0||!res.status) return '接続できませんでした。通信環境やCORS設定を確認してください。';
  return 'エラー '+res.status+'：'+(t||'').replace(/\s+/g,' ').slice(0,180); }
function extractJSON(s){ if(!s) return null; const m=s.match(/\{[\s\S]*\}/); if(!m) return null;
  try{return JSON.parse(m[0]);}catch(e){ try{return JSON.parse(m[0].replace(/,\s*\}/g,'}').replace(/,\s*\]/g,']'));}catch(e2){return null;} } }

/* AIの自由記述テキストを簡易マークダウンで表示 */
function renderAIText(container,text){
  const lines=(text||'').split('\n'); let ul=null;
  const flush=()=>{ if(ul){container.appendChild(ul);ul=null;} };
  lines.forEach(line=>{
    const t=line.trim();
    if(!t){ flush(); return; }
    let h=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');

    if(/^[-・*]\s/.test(t)||/^\d+[.)、]\s/.test(t)){ if(!ul){ul=el('ul');ul.style.paddingLeft='20px';ul.style.margin='4px 0';} const li=el('li','small'); li.innerHTML=h.replace(/^[-・*]\s/,'').replace(/^\d+[.)、]\s/,''); ul.appendChild(li); return; }
    flush(); const p=el('p','small'); p.style.margin='6px 0'; p.innerHTML=h; container.appendChild(p);
  });
  flush();
}

async function runAnalyzeAI(text,ctx){

  let u='次の出願書類の文章を分析してください。\n【設問】'+(ctx.question||'（指定なし）')+'\n';
  if(ctx.charLimit)u+='【文字数制限】'+ctx.charLimit+'字（現在 '+countJP(text)+'字）\n'; else u+='【現在の文字数】'+countJP(text)+'字\n';

  u+='【本文】\n'+text;
  const raw=await callAI(sys,u,{json:true,max:2200});

}
function ideaSimple(QS,ans){ const filled=Object.values(ans).filter(f=>f.get()); if(filled.length<2){toast('2つ以上答えると整理できます','warn');return;} openSheet('💡 整理された材料',(bb)=>{ bb.appendChild(el('div','note','あなたの回答から抜き出しました。捏造はしていません。ここから書類の軸を選びましょう。')); const map=['きっかけ（原体験）','あなたの行動','困難','工夫','変化・成長','大学とのつながり','具体的な根拠']; QS.forEach((q,i)=>{ if(ans[i].get()){ const c=el('div','card tight'); c.innerHTML=`<span class="badge navy">${esc(map[i])}</span><p class="small" style="margin:6px 0 0">${nl2br(ans[i].get())}</p>`; bb.appendChild(c); } }); // アピール軸
      const axis=el('div','card tight'); axis.innerHTML='<h4>アピールの軸（候補）</h4>'; const cand=[]; if(ans[1].get())cand.push('「自分で動いた」行動力の軸：'+ans[1].get().slice(0,30)); if(ans[3].get())cand.push('「工夫して乗り越えた」問題解決の軸：'+ans[3].get().slice(0,30)); if(ans[4].get())cand.push('「経験から変わった」成長の軸：'+ans[4].get().slice(0,30)); if(!cand.length)cand.push('もう少し回答が集まると、軸を提案できます。'); const ul=el('ul');ul.style.paddingLeft='18px'; cand.forEach(c=>{const li=el('li','small');li.textContent=c;ul.appendChild(li);}); axis.appendChild(ul); bb.appendChild(axis);
      bb.appendChild(el('p','xsmall muted','※これは材料の整理です。文章はあなた自身の言葉で組み立ててください。')); });
}
function aiOutline(){
  openSheet('🧱 構成案の作成',(b)=>{
    b.appendChild(el('p','small muted','設問・文字数・志望校・使う活動を選ぶと、方向性の異なる構成案を提示します。'));
    const sel=fieldSelect('志望校',S.meta.primarySchoolId,[{value:'',label:'—'},...S.schools.map(s=>({value:s.id,label:s.name+' '+(s.faculty||'')}))]); b.appendChild(sel);
    const qf=fieldText('設問','',null,{area:true,rows:2}); b.appendChild(qf);
    const lf=fieldText('文字数',S.schools.find(s=>s.id===S.meta.primarySchoolId)?.docs?'':'',null,{type:'number',placeholder:'例：1200'}); b.appendChild(lf);
    b.appendChild(el('p','small','使う活動（任意）：')); const chosen=[]; const box=el('div');box.style.cssText='display:flex;flex-wrap:wrap;gap:6px'; S.activities.forEach(a=>{const c=el('span','chip click',esc(a.name.slice(0,14)));c.onclick=()=>{const i=chosen.indexOf(a.id);if(i>=0){chosen.splice(i,1);c.classList.remove('sel');}else{chosen.push(a.id);c.classList.add('sel');}};box.appendChild(c);}); if(!S.activities.length)box.appendChild(el('span','xsmall muted','（活動を登録すると選べます）')); b.appendChild(box);
    const run=el('button','btn primary block',aiReady()?('🤖 '+aiLabel()+'で構成案を作る'):'構成案を作る（オフライン）'); run.style.marginTop='10px'; run.onclick=()=>{ const limit=+lf.get()||1000; const school=S.schools.find(s=>s.id===sel.get()); const acts=S.activities.filter(a=>chosen.includes(a.id)); if(aiReady()){ aiTextSheet('🧱 構成案','設問・志望校・あなたの活動をもとに、方向性の違う構成案をAIが提示します。文章は書かず骨組みだけ。',()=>runOutlineAI(limit,school,acts,qf.get())); } else { openSheet('🧱 構成案（3案）',(bb)=>{ buildOutlines(bb,limit,school,acts,qf.get()); }); } };
    b.appendChild(run);
    if(!aiReady()){ const c=el('button','btn ghost sm block','🔌 本物のAIに接続する');c.style.marginTop='8px';c.onclick=()=>openAISettings(); b.appendChild(c); }
  });
}
function buildOutlines(b,limit,school,acts,q){
  b.appendChild(el('div','note','方向性の異なる3案です。どれを軸にするかはあなたが選び、中身はあなたの言葉で書いてください。'));
  const univ=school?school.name:'志望大学'; const fac=school?(school.faculty||''):'';
  const actName=acts[0]?acts[0].name:'あなたの主な活動';
  const plans=[
    {title:'A. 原体験から始める案',theme:'一次体験に根ざした志望動機',strong:'説得力・本人らしさが出やすい',care:'原体験の描写が長くなりすぎないよう注意',
      paras:[['原体験',0.2,'関心の出発点になった具体的な出来事'],['問題意識',0.15,'その体験から感じた課題'],[`活動（${actName}）`,0.3,'自分の行動・工夫・結果を数字で'],['大学での学び',0.25,`${univ}${fac}でなければならない理由・学びたいこと`],['将来像',0.1,'学びをどう生かすか']]},
    {title:'B. 社会課題から始める案',theme:'課題解決への当事者意識',strong:'学部の関心と接続しやすい',care:'一般論に流れて「自分」が薄くならないよう注意',
      paras:[['社会課題の提示',0.2,'あなたが問題意識を持つ社会課題'],['自分との接点',0.2,'なぜ自分がその課題に関わるのか（原体験）'],[`活動（${actName}）`,0.3,'課題に対して実際にやったこと'],['大学での学び',0.2,`${univ}で深めたい学び`],['将来像',0.1,'目指す姿']]},
    {title:'C. 将来像から逆算する案',theme:'ビジョン先行・逆算型',strong:'一貫性と目的意識が伝わる',care:'将来像が抽象的だと弱い。具体的に',
      paras:[['将来実現したいこと',0.15,'目指す姿'],['原体験・問題意識',0.2,'そう思うに至った体験'],[`活動（${actName}）`,0.3,'その一歩として取り組んだこと'],['大学での学び',0.25,`${univ}${fac}で学ぶ必要性`],['まとめ',0.1,'決意']]}
  ];
  plans.forEach(p=>{ const det=el('details','acc'); det.open=true; det.innerHTML=`<summary>${esc(p.title)}</summary>`; const body=el('div','acc-body');
    body.innerHTML=`<p class="small"><b>中心テーマ：</b>${esc(p.theme)}</p><p class="small"><span class="badge ok">強み</span> ${esc(p.strong)}</p><p class="small"><span class="badge warn">注意</span> ${esc(p.care)}</p><p class="small" style="margin-top:6px;font-weight:700">段落構成（目安 全${limit}字）</p>`;
    p.paras.forEach(([name,ratio,role])=>{ const row=el('div','list-row'); row.innerHTML=`<div style="flex:1"><b class="small">${esc(name)}</b><div class="xsmall muted">${esc(role)}</div></div><span class="badge grey">約${Math.round(limit*ratio)}字</span>`; body.appendChild(row); });
    det.appendChild(body); b.appendChild(det); });
  b.appendChild(el('p','xsmall muted','※これは構成の骨組みです。各段落はあなたの経験と言葉で埋めてください。埋めたら「文章の分析」でチェックできます。'));
}

render();
initCloud();
