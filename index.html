/* =========================================================================
   音声入力・音声ファイルの文字起こし
   - 🎤 音声入力：この端末のブラウザ標準音声認識（Chrome/Safari等）。音声は端末で文字に。
   - 🎧 音声ファイル：ボイスメモ等の録音をOpenAI互換の文字起こしAPIへ送信（キー登録時のみ）
   - 📎 ファイル：PDF/Word/パワポ/テキストの内容を貼り付け
   ========================================================================= */
function sttSupported(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }
function sttFileReady(){ return !!(AICFG&&AICFG.key&&(AICFG.provider==='openai'||AICFG.provider==='compatible')); }
async function transcribeAudio(file){
  if(typeof window!=='undefined'&&window.__AO_STT_MOCK) return await window.__AO_STT_MOCK(file);
  if(!sttFileReady()) throw new Error('音声ファイルの文字起こしには GPT（OpenAI）または互換API のキー登録が必要です。「その他 → AI設定」から登録してください。');
  if(file.size>25*1024*1024) throw new Error('ファイルが大きすぎます（25MBまで）。録音を分割してお試しください。');
  const base=(AICFG.provider==='openai')?'https://api.openai.com/v1':String(AICFG.baseURL||'').replace(/\/+$/,'');
  if(!base) throw new Error('互換APIのエンドポイントが未設定です。');
  const fd=new FormData(); fd.append('file',file,file.name||'audio.m4a'); fd.append('model',AICFG.sttModel||'whisper-1'); fd.append('language','ja');
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),180000);
  try{
    const res=await fetch(base+'/audio/transcriptions',{method:'POST',signal:ctrl.signal,headers:{'Authorization':'Bearer '+AICFG.key},body:fd});
    if(!res.ok) throw new Error(await friendlyErr(res));
    const j=await res.json(); const t=String(j.text||'').trim();
    if(!t) throw new Error('音声から文字を取り出せませんでした。');
    return t;
  }catch(e){ if(e&&e.name==='AbortError') throw new Error('文字起こしがタイムアウトしました。録音を短く分割してお試しください。'); throw e; }
  finally{ clearTimeout(to); }
}
/* 入力欄（textarea/input）の下に「音声入力・音声ファイル・ファイル読込」を付ける */
function voiceTools(ta,opts){
  opts=opts||{};
  const wrap=el('div'); wrap.style.margin='-4px 0 10px';
  const row=el('div','btn-row');
  const status=el('div','xsmall muted'); status.style.marginTop='4px';
  const fire=()=>{ try{ta.dispatchEvent(new Event('input',{bubbles:true}));}catch(e){} try{ta.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){} if(opts.onchange)opts.onchange(ta.value); };
  const append=(txt)=>{ const cur=String(ta.value||'').replace(/\s+$/,''); ta.value=cur?cur+'\n'+txt:txt; fire(); };
  let rec=null,recording=false;
  const mic=el('button','btn sm teal','🎤 音声入力');
  mic.onclick=()=>{
    if(recording){ try{rec.stop();}catch(e){} return; }
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ status.textContent='この端末・ブラウザは音声入力に未対応です。Chrome や Safari でお試しいただくか、🎧 で録音ファイルをご利用ください。'; toast('この端末は音声入力に未対応です','warn'); return; }
    rec=new SR(); rec.lang='ja-JP'; rec.continuous=true; rec.interimResults=true;
    const base=String(ta.value||'').replace(/\s+$/,''); let fin='';
    rec.onstart=()=>{ recording=true; mic.textContent='⏹ 停止（録音中…）'; mic.classList.add('danger'); status.textContent='話してください。認識した言葉がそのまま入力されます。終わったら「停止」を押してください。'; };
    rec.onresult=e=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) fin+=r[0].transcript; else interim+=r[0].transcript; } ta.value=(base?base+'\n':'')+fin+interim; };
    rec.onerror=ev=>{ const c=ev&&ev.error; status.textContent=(c==='not-allowed'||c==='service-not-allowed')?'マイクの使用が許可されていません。ブラウザの設定でマイクを許可してください。':(c==='no-speech'?'音声が聞き取れませんでした。もう一度お試しください。':'音声認識でエラーが発生しました（'+c+'）'); };
    rec.onend=()=>{ recording=false; mic.textContent='🎤 音声入力'; mic.classList.remove('danger'); ta.value=(base?base+'\n':'')+fin; fire(); if(fin.trim()) status.textContent='音声入力を反映しました。誤変換がないか必ず確認してください。'; };
    try{ rec.start(); }catch(e){ toast('音声入力を開始できませんでした','err'); }
  };
  row.appendChild(mic);
  const af=el('button','btn sm','🎧 録音ファイルから文字起こし');
  af.onclick=()=>{ const inp=el('input'); inp.type='file'; inp.accept='audio/*,.m4a,.mp3,.wav,.mp4,.webm,.ogg,.aac,.flac';
    inp.onchange=async e=>{ const f=e.target.files[0]; if(!f) return; af.disabled=true; status.textContent='文字起こし中…（録音の長さにより数十秒かかります）';
      try{ const t=await transcribeAudio(f); append(t); status.textContent='「'+f.name+'」を文字起こしして追記しました。誤変換がないか確認してください。'; toast('文字起こしを追記しました','ok'); }
      catch(err){ status.textContent=''; toast((err&&err.message)||'文字起こしに失敗しました','err'); }
      finally{ af.disabled=false; } };
    inp.click(); };
  row.appendChild(af);
  const fl=el('button','btn sm ghost','📎 ファイルから貼り付け');
  fl.onclick=()=>pickFile('.pdf,.docx,.pptx,.txt,.md,.csv',(text,meta)=>{ append(text); status.textContent='「'+((meta&&meta.name)||'ファイル')+'」の内容を追記しました。'; toast('読み込みました','ok'); });

const AICFG_KEY='aoCompass_ai';
let AICFG=(()=>{try{return JSON.parse(localStorage.getItem(AICFG_KEY))||{}}catch(e){return{}}})();
function saveAICFG(){try{localStorage.setItem(AICFG_KEY,JSON.stringify(AICFG));}catch(e){toast('設定の保存に失敗しました','err');}}
function aiReady(){return !!(AICFG.key&&AICFG.provider);}
function aiLabel(){return AICFG.provider==='anthropic'?'Claude':AICFG.provider==='openai'?'GPT':(AICFG.provider==='compatible'?'カスタムAI':'AI');}
function defaultModel(p){return p==='anthropic'?'claude-3-5-sonnet-latest':p==='openai'?'gpt-4o-mini':'';}

const AI_RULES=[

'・表面的な指摘（誤字・言い回し・文字数）だけで終わらせない。まず論の骨格（主張と根拠がつながっているか、経験から学びへの飛躍がないか、その大学でなければならない必然性があるか）を見る。',

async function callAI(system,user,opts={}){
  if(typeof window!=='undefined'&&window.__AO_AI_MOCK) return await window.__AO_AI_MOCK(system,user,opts);
  if(!aiReady()) throw new Error('AIが未接続です。設定でAPIキーを登録してください。');
  const prov=AICFG.provider; const controller=new AbortController();
  const to=setTimeout(()=>controller.abort(),70000);
  try{
    if(prov==='anthropic'){
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:controller.signal,
        headers:{'content-type':'application/json','x-api-key':AICFG.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:AICFG.model||defaultModel('anthropic'),max_tokens:opts.max||1800,system,messages:[{role:'user',content:user}]})});
      if(!res.ok) throw new Error(await friendlyErr(res));
      const d=await res.json(); const tx=(d.content||[]).map(c=>c.text||'').join('').trim();
      try{ recordUsage('anthropic',AICFG.model||defaultModel('anthropic'),(d.usage&&d.usage.input_tokens)||Math.round((String(system).length+String(user).length)/2),(d.usage&&d.usage.output_tokens)||Math.round(tx.length/2),opts.label||''); }catch(e){}
      return tx;
    } else {
      const base=(AICFG.baseURL||'https://api.openai.com/v1').replace(/\/+$/,'');
      const body={model:AICFG.model||defaultModel('openai'),messages:[{role:'system',content:system},{role:'user',content:user}]};
      if(opts.json) body.response_format={type:'json_object'};
      const res=await fetch(base+'/chat/completions',{method:'POST',signal:controller.signal,
        headers:{'content-type':'application/json','authorization':'Bearer '+AICFG.key},body:JSON.stringify(body)});
      if(!res.ok) throw new Error(await friendlyErr(res));
      const d=await res.json(); const tx=(d.choices&&d.choices[0]&&d.choices[0].message.content||'').trim();
      try{ recordUsage(prov,AICFG.model||defaultModel('openai'),(d.usage&&d.usage.prompt_tokens)||Math.round((String(system).length+String(user).length)/2),(d.usage&&d.usage.completion_tokens)||Math.round(tx.length/2),opts.label||''); }catch(e){}
      return tx;
    }
  }catch(e){ if(e.name==='AbortError') throw new Error('応答がタイムアウトしました。通信環境を確認して再試行してください。'); throw e; }
  finally{ clearTimeout(to); }
}
async function friendlyErr(res){ let t=''; try{t=await res.text();}catch(e){}
  if(res.status===401||res.status===403) return 'APIキーが正しくないか、権限がありません（'+res.status+'）。設定を確認してください。';
  if(res.status===429) return '利用上限に達したか、混雑しています（429）。少し待って再試行してください。';
  if(res.status===404) return 'モデル名またはエンドポイントが見つかりません（404）。モデル名を確認してください。';
  if(res.status===0||!res.status) return '接続できませんでした。通信環境やCORS設定を確認してください。';
  return 'エラー '+res.status+'：'+(t||'').replace(/\s+/g,' ').slice(0,180); }
function extractJSON(s){ if(!s) return null; const m=s.match(/\{[\s\S]*\}/); if(!m) return null;
  try{return JSON.parse(m[0]);}catch(e){ try{return JSON.parse(m[0].replace(/,\s*\}/g,'}').replace(/,\s*\]/g,']'));}catch(e2){return null;} } }

function aiLoading(container,msg){ container.innerHTML=''; const d=el('div','empty'); d.innerHTML=`<div class="em">🤖</div><h4>${esc(msg||'AIが考えています…')}</h4><p class="small muted">数秒〜十数秒かかることがあります</p>`; d.appendChild(el('div','spinner')); container.appendChild(d); return d; }
function aiError(container,e,retry){ const d=el('div','card'); d.innerHTML=`<div class="card-title"><span class="ic">⚠️</span><h3>AIに接続できませんでした</h3></div><p class="small">${esc(e.message||String(e))}</p>`; const row=el('div','btn-row');row.style.marginTop='8px'; const s=el('button','btn sm','AI設定を開く');s.onclick=()=>openAISettings(); row.appendChild(s); if(retry){const r=el('button','btn sm ghost','再試行');r.onclick=retry;row.appendChild(r);} d.appendChild(row); container.appendChild(d); }
/* AIの自由記述テキストを簡易マークダウンで表示 */
function renderAIText(container,text){
  const lines=(text||'').split('\n'); let ul=null;
  const flush=()=>{ if(ul){container.appendChild(ul);ul=null;} };
  lines.forEach(line=>{
    const t=line.trim();
    if(!t){ flush(); return; }
    let h=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^#{1,6}\s/.test(t)){ flush(); const hd=el('h4',null,h.replace(/^#{1,6}\s/,'')); hd.style.margin='10px 0 4px'; container.appendChild(hd); return; }
    if(/^[-・*]\s/.test(t)||/^\d+[.)、]\s/.test(t)){ if(!ul){ul=el('ul');ul.style.paddingLeft='20px';ul.style.margin='4px 0';} const li=el('li','small'); li.innerHTML=h.replace(/^[-・*]\s/,'').replace(/^\d+[.)、]\s/,''); ul.appendChild(li); return; }
    flush(); const p=el('p','small'); p.style.margin='6px 0'; p.innerHTML=h; container.appendChild(p);
  });
  flush();
}

async function runAnalyzeAI(text,ctx){

  let sys=AI_RULES+'\n\n出力は日本語で、次のJSONのみ（コードブロックや前置き・後置きの文章を付けない）：\n'

    +'q1=なぜその分野に興味を持ったのか分かる／q2=なぜその大学・学部なのか分かる／q3=大学で何を学びたいのか分かる／q4=卒業後その学びをどう生かすのか分かる。'
    +'aは、はっきり読み取れる=yes、触れているが弱い・抽象的=partly、書かれていない=no。甘くつけない。whyは本文の該当箇所に基づいて書く。fixは本人が次に足すことを1文で。\n'
    +'findingsは8〜12件。うちmustとimportantを合わせて4件以上。数合わせのために薄い指摘を足すのではなく、下の観点を順に当てれば必ずその数になる。\n'
    +'必ず次の観点を一通り点検し、当てはまるものを指摘に含めること：\n'
    +'(1)主張と根拠のつながり：「〜と考えた」「〜を学んだ」の直前に、そう考えるに至る事実が書かれているか。飛躍していないか。\n'
    +'(2)因果の説明：なぜそう思ったのか、なぜその行動を選んだのかが書かれているか。結果だけになっていないか。\n'
    +'(3)本人にしか書けないか：同じ文章を、同じ活動をした他の高校生がそのまま書けてしまわないか。書けてしまう箇所を指摘する。\n'
    +'(4)必然性：その大学・学部でなければならない理由が、資料に基づいて書かれているか。他大学に置き換えても成立する文を指摘する。\n'
    +'(5)抽象語：「頑張った」「様々な」「多くの」「コミュニケーション能力」など、中身が入っていない語を引用して挙げる。\n'
    +'(6)重複：同じことを言い換えているだけの箇所。削れば字数が空くことも伝える。\n'
    +'(7)時間の流れ：過去の経験→現在の問題意識→大学での学び→将来、のどこが抜けているか。\n'
    +'(8)設問との対応：設問が聞いていることに正面から答えているか。聞かれていないことに字数を使っていないか。\n'

    +'(11)問題意識：「好きだから」「興味があるから」で止まっていないか。好き→疑問→課題→学びたい、の流れになっているか。興味ではなく問題意識から始まっているかを見る。\n'
    +'(12)きっかけの具体性：「ニュースを見て」のような受け身のきっかけは弱い。実際に本人が動いた・体験した出来事になっているかを見る。\n'

/* AI分析の結果は書類ごとに保存します。閉じても消えないので、開き直すたびにAPIを使わずに済みます。 */
function saveDocAnalysis(doc,data,text){
  if(!doc||!doc.id||!data) return;
  doc.aiAnalysis={at:Date.now(),label:aiLabel(),sig:txtSig(text),len:countJP(text||''),data:data};
  doc.updatedAt=Date.now();

}
function clearDocAnalysis(doc){ if(!doc) return; doc.aiAnalysis=null; doc.updatedAt=Date.now(); try{ save(); }catch(e){} }
/* 保存された分析を、いつの結果かを添えて描画します */
function renderSavedAnalysis(host,doc,curText,onRerun){
  const sv=doc&&doc.aiAnalysis; if(!sv||!sv.data) return false;
  const stale=sv.sig!==txtSig(curText==null?(doc.body||''):curText);

  hd.innerHTML='💾 <b>'+esc(fmtDT(sv.at))+' の分析結果</b>（'+esc(sv.label||'AI')+'）を表示しています。書類を閉じても残るので、開き直すだけではAPIを使いません。';
  host.appendChild(hd);

  const rb=el('button','btn sm'+(stale?' primary':''),'🔄 いまの本文でもう一度AI分析する'); rb.onclick=()=>onRerun&&onRerun(); row.appendChild(rb);
  const db=el('button','btn sm ghost','この結果を消す');
  db.onclick=()=>confirmDelete('保存されたAI分析の結果を削除します。もう一度見るには、再度AIで分析する必要があります（APIを使います）。',()=>{ clearDocAnalysis(doc); toast('分析結果を削除しました','ok'); try{ closeSheet(); }catch(e){} if(typeof openDocEditor==='function'&&doc.id) openDocEditor(doc.id,'ai'); });

/* 文脈から analyze を実行して結果シートを表示（real優先/簡易フォールバック） */
let _analyzeDoc=null;
function analyzeAndShow(text,ctx,titleBase,force){
  const doc=(ctx&&ctx.doc)||null;
  _analyzeDoc=doc;
  if(!aiReady()){ const a=analyzeText(text,ctx); openSheet('🔎 '+titleBase+'（簡易AI）',bb=>renderAnalysis(bb,a,text)); return; }
  const sv=doc&&doc.aiAnalysis;
  /* 本文が前回の分析から変わっていなければ、保存結果を出すだけ。APIは使いません。 */
  if(!force&&sv&&sv.data&&sv.sig===txtSig(text)){
    openSheet('🔎 '+titleBase+'（保存された結果）',bb=>{ _analyzeDoc=doc; renderSavedAnalysis(bb,doc,text,()=>analyzeAndShow(text,ctx,titleBase,true)); });
    return;

  openSheet('🔎 '+titleBase+'（'+aiLabel()+'）',bb=>{ const body=el('div'); bb.appendChild(body); const run=()=>{ _analyzeDoc=doc; aiLoading(body,'AIが分析しています…'); runAnalyzeAI(text,ctx).then(res=>{ body.innerHTML=''; saveDocAnalysis(doc,res,text); renderAnalysisReal(body,res,text,{doc:doc}); }).catch(e=>{ body.innerHTML=''; aiError(body,e,run); }); }; run(); });
}

/* ===== AI分析の指摘を「宿題」タスクにする ===== */
/* 指摘は読んだだけでは直りません。期限つきのタスクにして、次の日までの宿題にします。 */
function hwText(x){
  if(!x) return '';
  if(typeof x==='string') return x.trim();
  return String(x.title||x.how||x.why||'').trim();
}
/* 指摘は「〜がありません」のような診断の形なので、タスク名は行動の形に整えます */
function hwTitle(t){
  t=String(t||'').trim().replace(/[。．.]+$/,'');
  if(/(ません|ないです|でない|不足|弱い|少ない|多すぎ|長すぎ|短すぎ|曖昧|あいまい|不明|見当たり)/.test(t)) return t+' → ここを直す';
  return t;
}
function hwWhy(x,fallback){
  if(x&&typeof x==='object'){ const w=[x.how,x.why].filter(Boolean).join(' / '); if(w) return w; }
  return fallback||'AI分析で指摘された点です。自分の言葉で直してください。';
}
function makeHomework(list,doc,dayOff){
  const due=isoAdd(todayISO(),dayOff);
  const nm=doc&&doc.title?(doc.title.length>12?doc.title.slice(0,12)+'…':doc.title):'書類';
  let n=0;
  (list||[]).slice(0,3).forEach(x=>{
    const t=hwText(x); if(!t) return;
    const title=nm+'：'+hwTitle(t);
    if(S.tasks.some(k=>!k.done&&k.title===title&&k.due===due)) return;
    S.tasks.push({id:uid(),title:title,due:due,category:'書類',schoolId:doc?doc.schoolId:null,
      why:hwWhy(x),auto:false,hw:true,done:false});
    n++;
  });
  if(n){ save(); }
  return n;
}

function gradeOf(v){ v=Math.max(0,Math.min(100,+v||0)); return v>=85?'S':v>=72?'A':v>=58?'B':v>=42?'C':'D'; }
function gradeColor(g){ return g==='S'?'#b8860b':g==='A'?'#2e8b57':g==='B'?'#128f8b':g==='C'?'#e8873b':'#b4573f'; }
function gradeWord(g){ return g==='S'?'とても良く書けています':g==='A'?'かなり仕上がってきました':g==='B'?'土台はできています':g==='C'?'まだ直す余地が大きいです':'これから作り込みましょう'; }
/* 8つの観点を5角形の5軸にまとめる */
const RADAR_AXES=[
  ['具体性',['具体性']],
  ['論理・一貫',['一貫性','論理性']],
  ['独自性',['独自性','本人らしさ']],
  ['志望校適合',['志望校との接続','設問への適合']],
  ['読みやすさ',['読みやすさ']]
];
function radarValues(scores){
  const g=k=>Math.max(0,Math.min(100,+((scores||{})[k])||0));
  return RADAR_AXES.map(([label,keys])=>{
    const vs=keys.filter(k=>(scores||{})[k]!=null).map(g);
    const v=vs.length?Math.round(vs.reduce((a,b)=>a+b,0)/vs.length):0;
    return {label:label,value:v};
  });
}
function overallScore(scores){
  const vs=Object.values(scores||{}).map(v=>Math.max(0,Math.min(100,+v||0)));
  if(!vs.length) return 0;
  return Math.round(vs.reduce((a,b)=>a+b,0)/vs.length);
}
/* 五角形のレーダーチャートをSVGで描く（外部ライブラリ不要） */
function radarSVG(axes,size){
  size=size||250; const PAD=42, W=size+PAD*2, H=size+8;
  const cx=W/2, cy=H/2, R=size*0.30;
  const n=axes.length;
  const pt=(i,r)=>{ const ang=(-90+i*360/n)*Math.PI/180; return [cx+Math.cos(ang)*r, cy+Math.sin(ang)*r]; };
  const poly=r=>axes.map((_,i)=>pt(i,r).map(x=>x.toFixed(1)).join(',')).join(' ');
  let g='';
  [1,.75,.5,.25].forEach(f=>{ g+='<polygon points="'+poly(R*f)+'" fill="none" stroke="#dfe5ea" stroke-width="1"/>'; });
  axes.forEach((_,i)=>{ const [x,y]=pt(i,R); g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#dfe5ea" stroke-width="1"/>'; });
  const dp=axes.map((a,i)=>pt(i,R*Math.max(0.02,(Math.max(0,Math.min(100,a.value))/100))).map(x=>x.toFixed(1)).join(',')).join(' ');
  g+='<polygon points="'+dp+'" fill="rgba(18,143,139,.22)" stroke="#128f8b" stroke-width="2" stroke-linejoin="round"/>';
  axes.forEach((a,i)=>{ const [x,y]=pt(i,R*Math.max(0.02,(Math.max(0,Math.min(100,a.value))/100))); g+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.2" fill="#128f8b"/>'; });
  axes.forEach((a,i)=>{ const [x,y]=pt(i,R+18);
    const anchor=Math.abs(x-cx)<6?'middle':(x>cx?'start':'end');
    const dy=(y<cy-4)?0:(Math.abs(y-cy)<6?4:11);
    g+='<text x="'+x.toFixed(1)+'" y="'+(y+dy).toFixed(1)+'" text-anchor="'+anchor+'" font-size="11" font-weight="700" fill="#556070">'+esc(a.label)+'</text>';
    g+='<text x="'+x.toFixed(1)+'" y="'+(y+dy+13).toFixed(1)+'" text-anchor="'+anchor+'" font-size="11" font-weight="900" fill="'+gradeColor(gradeOf(a.value))+'">'+gradeOf(a.value)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px;height:auto" role="img" aria-label="観点別レーダーチャート">'+g+'</svg>';
}
/* 過去の評価を書類ごとに残す（前回比を出すため） */
function pushScoreHistory(doc,total,text,kind,scores){
  if(!doc||!doc.id) return null;
  if(!Array.isArray(doc.scoreHistory)) doc.scoreHistory=[];
  kind=kind||'ai';
  const len=countJP(text||'');
  const h=doc.scoreHistory;
  const same=h.filter(x=>(x.kind||'ai')===kind);
  const last=same[same.length-1];
  if(last&&last.total===total&&last.len===len) return same.length>1?same[same.length-2]:null;
  h.push({at:Date.now(),total:total,len:len,kind:kind,scores:scores||null});
  if(h.length>20) doc.scoreHistory=h.slice(-20);
  try{ save(); }catch(e){}
  return last||null;
}
/* 保存済みの結果を開き直したときは、履歴を増やさずに前回だけ見ます */
function peekScoreHistory(doc,total,kind){
  if(!doc||!Array.isArray(doc.scoreHistory)) return null;
  kind=kind||'ai';
  const same=doc.scoreHistory.filter(x=>(x.kind||'ai')===kind);
  if(!same.length) return null;
  const li=same.length-1;
  if(same[li].total===total) return li>0?same[li-1]:null;
  return same[li];
}
function histList(doc,kind){ if(!doc||!Array.isArray(doc.scoreHistory)) return []; kind=kind||'ai'; return doc.scoreHistory.filter(x=>(x.kind||'ai')===kind); }
/* 前回比のバッジ（＋なら緑、−なら赤） */
function deltaChip(now,prev,small){
  if(prev==null) return '';
  const d=Math.round(now-prev);
  const cls=d>0?'up':d<0?'dn':'fl';
  const txt=(d>0?'+':'')+d;
  return small?'<span class="dsm" style="color:'+(d>0?'#2e8b57':d<0?'#b4573f':'#8792a2')+'">'+txt+'</span>'
    :'<span class="dchip '+cls+'">前回比 '+txt+'点</span>';
}
/* 評価シート本体。すべての分析画面から呼ばれます。 */
function renderScoreCard(host,scores,opts){

      axr.appendChild(c); });
    bd.appendChild(axr);
    const sc=el('div'); sc.style.marginTop='10px';
    Object.entries(norm).forEach(([k,v])=>{ const bar=el('div','scorebar'); const color=gradeColor(gradeOf(v));
      const dl=(pv&&pv[k]!=null)?deltaChip(v,pv[k],true):'';
      bar.innerHTML='<span class="lbl">'+esc(k)+'</span><span class="track"><span style="width:'+v+'%;background:'+color+'"></span></span><span class="val" style="color:'+color+'">'+gradeOf(v)+dl+'</span>';
      sc.appendChild(bar); });
    bd.appendChild(sc);
    if(pv) bd.appendChild(el('p','xsmall muted','小さい数字は前回の分析からの増減です。'));
    const sl=el('div','gs-scale'); sl.innerHTML='<span>S 85〜</span><span>A 72〜</span><span>B 58〜</span><span>C 42〜</span><span>D 〜41</span>';
    bd.appendChild(sl);
    bd.appendChild(el('p','xsmall muted','※この評価はアプリ内の目安であり、合否とは無関係です。大学の評価基準とは異なります。'));

  if(HL.length>=2){

    tgCard(wrap,{icon:'📈',title:'推移（'+HL.length+'回）',right:'最初から '+(lastT-first>0?'+':'')+(lastT-first)+'点',key:'sc.hist.'+kind,open:false},(bd)=>{
      HL.slice(-8).forEach((h,i,arr)=>{ const r=el('div','histrow');
        const pr=i>0?arr[i-1].total:null;
        r.innerHTML='<span class="hd">'+(h.cur?'<b style="color:var(--ink)">今回</b>':esc(fmtDT(h.at).replace(/^\d+年/,'')))+'</span>'
          +'<span class="hb"><span style="width:'+Math.max(2,h.total)+'%;background:'+gradeColor(gradeOf(h.total))+'"></span></span>'

function aiIdea(){
  const QS=['その活動を始めたきっかけは何ですか？','あなた自身は具体的に何をしましたか？','最も困ったことは何ですか？','どのような工夫をしましたか？','活動の前後で、あなたの中で何が変わりましたか？','その経験は、大学で学びたいこととどうつながりますか？','それを示す具体的な出来事や数字はありますか？'];
  const ans={};
  openSheet('💡 アイデア相談',(b)=>{
    b.appendChild(el('div','note info','AIはすぐに文章を作りません。まず質問に答えてください。答えから、使えそうな材料を整理します。'));
    QS.forEach((q,i)=>{ const f=fieldText((i+1)+'. '+q,'',null,{area:true,rows:2}); f._key=i; b.appendChild(f); ans[i]=f; });
    if(aiReady()){ const runR=el('button','btn primary block','🤖 '+aiLabel()+'に整理・深掘りしてもらう'); runR.onclick=()=>{ const filled=Object.entries(ans).filter(([i,f])=>f.get()); if(filled.length<2){toast('2つ以上答えると整理できます','warn');return;} const arr=QS.map((q,i)=>ans[i].get()?(q+' → '+ans[i].get()):null).filter(Boolean); aiTextSheet('💡 整理された材料と深掘り','あなたの回答をもとにAIが材料を整理し、さらに深掘りする質問を返します。捏造はしません。',()=>runIdeaAI(arr)); }; b.appendChild(runR); const alt=el('button','btn ghost sm block','簡易整理（オフライン）で見る');alt.style.marginTop='8px';alt.onclick=()=>ideaSimple(QS,ans); b.appendChild(alt); return; }
    const run=el('button','btn primary block','材料を整理する'); run.onclick=()=>ideaSimple(QS,ans); b.appendChild(run);
    const c=el('button','btn ghost sm block','🔌 本物のAIに接続する');c.style.marginTop='8px';c.onclick=()=>openAISettings(); b.appendChild(c);
  });
}
function ideaSimple(QS,ans){ const filled=Object.values(ans).filter(f=>f.get()); if(filled.length<2){toast('2つ以上答えると整理できます','warn');return;} openSheet('💡 整理された材料',(bb)=>{ bb.appendChild(el('div','note','あなたの回答から抜き出しました。捏造はしていません。ここから書類の軸を選びましょう。')); const map=['きっかけ（原体験）','あなたの行動','困難','工夫','変化・成長','大学とのつながり','具体的な根拠']; QS.forEach((q,i)=>{ if(ans[i].get()){ const c=el('div','card tight'); c.innerHTML=`<span class="badge navy">${esc(map[i])}</span><p class="small" style="margin:6px 0 0">${nl2br(ans[i].get())}</p>`; bb.appendChild(c); } }); // アピール軸
      const axis=el('div','card tight'); axis.innerHTML='<h4>アピールの軸（候補）</h4>'; const cand=[]; if(ans[1].get())cand.push('「自分で動いた」行動力の軸：'+ans[1].get().slice(0,30)); if(ans[3].get())cand.push('「工夫して乗り越えた」問題解決の軸：'+ans[3].get().slice(0,30)); if(ans[4].get())cand.push('「経験から変わった」成長の軸：'+ans[4].get().slice(0,30)); if(!cand.length)cand.push('もう少し回答が集まると、軸を提案できます。'); const ul=el('ul');ul.style.paddingLeft='18px'; cand.forEach(c=>{const li=el('li','small');li.textContent=c;ul.appendChild(li);}); axis.appendChild(ul); bb.appendChild(axis);
      bb.appendChild(el('p','xsmall muted','※これは材料の整理です。文章はあなた自身の言葉で組み立ててください。')); });
}
function aiOutline(){
  openSheet('🧱 構成案の作成',(b)=>{
    b.appendChild(el('p','small muted','設問・文字数・志望校・使う活動を選ぶと、方向性の異なる構成案を提示します。'));
    const sel=fieldSelect('志望校',S.meta.primarySchoolId,[{value:'',label:'—'},...S.schools.map(s=>({value:s.id,label:s.name+' '+(s.faculty||'')}))]); b.appendChild(sel);
    const qf=fieldText('設問','',null,{area:true,rows:2}); b.appendChild(qf);
    const lf=fieldText('文字数',S.schools.find(s=>s.id===S.meta.primarySchoolId)?.docs?'':'',null,{type:'number',placeholder:'例：1200'}); b.appendChild(lf);
    b.appendChild(el('p','small','使う活動（任意）：')); const chosen=[]; const box=el('div');box.style.cssText='display:flex;flex-wrap:wrap;gap:6px'; S.activities.forEach(a=>{const c=el('span','chip click',esc(a.name.slice(0,14)));c.onclick=()=>{const i=chosen.indexOf(a.id);if(i>=0){chosen.splice(i,1);c.classList.remove('sel');}else{chosen.push(a.id);c.classList.add('sel');}};box.appendChild(c);}); if(!S.activities.length)box.appendChild(el('span','xsmall muted','（活動を登録すると選べます）')); b.appendChild(box);
    const run=el('button','btn primary block',aiReady()?('🤖 '+aiLabel()+'で構成案を作る'):'構成案を作る（オフライン）'); run.style.marginTop='10px'; run.onclick=()=>{ const limit=+lf.get()||1000; const school=S.schools.find(s=>s.id===sel.get()); const acts=S.activities.filter(a=>chosen.includes(a.id)); if(aiReady()){ aiTextSheet('🧱 構成案','設問・志望校・あなたの活動をもとに、方向性の違う構成案をAIが提示します。文章は書かず骨組みだけ。',()=>runOutlineAI(limit,school,acts,qf.get())); } else { openSheet('🧱 構成案（3案）',(bb)=>{ buildOutlines(bb,limit,school,acts,qf.get()); }); } };
    b.appendChild(run);
    if(!aiReady()){ const c=el('button','btn ghost sm block','🔌 本物のAIに接続する');c.style.marginTop='8px';c.onclick=()=>openAISettings(); b.appendChild(c); }
  });
}
function buildOutlines(b,limit,school,acts,q){
  b.appendChild(el('div','note','方向性の異なる3案です。どれを軸にするかはあなたが選び、中身はあなたの言葉で書いてください。'));
  const univ=school?school.name:'志望大学'; const fac=school?(school.faculty||''):'';
  const actName=acts[0]?acts[0].name:'あなたの主な活動';
  const plans=[
    {title:'A. 原体験から始める案',theme:'一次体験に根ざした志望動機',strong:'説得力・本人らしさが出やすい',care:'原体験の描写が長くなりすぎないよう注意',
      paras:[['原体験',0.2,'関心の出発点になった具体的な出来事'],['問題意識',0.15,'その体験から感じた課題'],[`活動（${actName}）`,0.3,'自分の行動・工夫・結果を数字で'],['大学での学び',0.25,`${univ}${fac}でなければならない理由・学びたいこと`],['将来像',0.1,'学びをどう生かすか']]},
    {title:'B. 社会課題から始める案',theme:'課題解決への当事者意識',strong:'学部の関心と接続しやすい',care:'一般論に流れて「自分」が薄くならないよう注意',
      paras:[['社会課題の提示',0.2,'あなたが問題意識を持つ社会課題'],['自分との接点',0.2,'なぜ自分がその課題に関わるのか（原体験）'],[`活動（${actName}）`,0.3,'課題に対して実際にやったこと'],['大学での学び',0.2,`${univ}で深めたい学び`],['将来像',0.1,'目指す姿']]},
    {title:'C. 将来像から逆算する案',theme:'ビジョン先行・逆算型',strong:'一貫性と目的意識が伝わる',care:'将来像が抽象的だと弱い。具体的に',
      paras:[['将来実現したいこと',0.15,'目指す姿'],['原体験・問題意識',0.2,'そう思うに至った体験'],[`活動（${actName}）`,0.3,'その一歩として取り組んだこと'],['大学での学び',0.25,`${univ}${fac}で学ぶ必要性`],['まとめ',0.1,'決意']]}
  ];
  plans.forEach(p=>{ const det=el('details','acc'); det.open=true; det.innerHTML=`<summary>${esc(p.title)}</summary>`; const body=el('div','acc-body');
    body.innerHTML=`<p class="small"><b>中心テーマ：</b>${esc(p.theme)}</p><p class="small"><span class="badge ok">強み</span> ${esc(p.strong)}</p><p class="small"><span class="badge warn">注意</span> ${esc(p.care)}</p><p class="small" style="margin-top:6px;font-weight:700">段落構成（目安 全${limit}字）</p>`;
    p.paras.forEach(([name,ratio,role])=>{ const row=el('div','list-row'); row.innerHTML=`<div style="flex:1"><b class="small">${esc(name)}</b><div class="xsmall muted">${esc(role)}</div></div><span class="badge grey">約${Math.round(limit*ratio)}字</span>`; body.appendChild(row); });
    det.appendChild(body); b.appendChild(det); });
  b.appendChild(el('p','xsmall muted','※これは構成の骨組みです。各段落はあなたの経験と言葉で埋めてください。埋めたら「文章の分析」でチェックできます。'));
}
