<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#eef1f4; --line:#e2e6eb;
  --ink:#1f2933; --ink-2:#556070; --ink-3:#8792a2;
  --navy:#1f3b57; --navy-2:#2c5478; --teal:#128f8b; --teal-soft:#e2f3f2;
  --orange:#e8873b; --orange-soft:#fdefe1;
  --ok:#2e8b57; --ok-soft:#e6f4ec; --warn:#c9772a; --warn-soft:#fbeede; --alert:#b4573f;
  --shadow:0 1px 2px rgba(31,41,51,.06),0 6px 20px rgba(31,41,51,.06);
  --radius:16px; --radius-s:11px;
  --font:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',Meiryo,system-ui,sans-serif;
  --maxw:960px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); color:var(--ink); background:var(--bg);
  line-height:1.7; font-size:15px; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.4}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px}
a{color:var(--teal)}

/* ---------- Layout ---------- */
.app{max-width:var(--maxw);margin:0 auto}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--navy);letter-spacing:.02em}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--navy),var(--teal));position:relative;flex:none}
.brand .logo::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid #fff;border-top-color:var(--orange);transform:rotate(35deg)}
.brand small{display:block;font-weight:600;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.topbar .spacer{flex:1}
.disclaimer{
  background:var(--navy);color:#dfe9f1;font-size:11.5px;line-height:1.55;
  padding:7px 16px;text-align:center;letter-spacing:.01em
}
.disclaimer b{color:#fff}

.view{padding:16px 16px 8px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 14px}
.page-head h2{font-size:20px}
.page-head p{margin:2px 0 0;color:var(--ink-2);font-size:12.5px}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card.tight{padding:13px}
.card h3{font-size:15px}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-title .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);flex:none;font-size:16px}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.xsmall{font-size:11.5px}
.grid{display:grid;gap:12px}
@media(min-width:620px){.grid.cols-2{grid-template-columns:1fr 1fr}.grid.cols-3{grid-template-columns:repeat(3,1fr)}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);border-radius:11px;padding:10px 15px;font-size:14px;font-weight:600;transition:.15s}
.btn:hover{border-color:#cfd6de;background:#fbfcfd}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.teal:hover{filter:brightness(1.05)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.btn.danger{color:var(--alert);border-color:#e8cfc8}
.btn.danger:hover{background:#fbf1ee}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chip:focus-visible{outline:3px solid var(--teal-soft);outline-offset:2px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Chips / tags / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);color:var(--ink-2);
  border:1px solid transparent;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.chip.sel{background:var(--teal-soft);color:var(--teal);border-color:#bfe6e4}
.chip.click{cursor:pointer}
.chip.click:hover{border-color:#cfd6de}
.chip.click:active{transform:scale(.96)}
.chip-btn{font-family:inherit;cursor:pointer}
.save-st{font-size:11px;font-weight:700;margin-top:5px;min-height:16px;color:var(--ink-3)}
.save-st.dirty{color:var(--warn)}
.save-st.ok{color:var(--ok)}
.save-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}
.badge.navy{background:#e7edf3;color:var(--navy)}
.badge.teal{background:var(--teal-soft);color:var(--teal)}
.badge.orange{background:var(--orange-soft);color:var(--orange)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.alert{background:#f7e7e2;color:var(--alert)}
.badge.grey{background:var(--surface-2);color:var(--ink-2)}
.pill-priority{font-weight:800}

/* ---------- Progress ---------- */
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog>span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--navy-2));border-radius:99px;transition:width .4s}
.ring{--p:0;--c:var(--teal);width:56px;height:56px;border-radius:50%;flex:none;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center}
.ring>i{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;color:var(--navy)}

/* ---------- Countdown ---------- */
.countdown{display:flex;align-items:center;gap:14px}
.countdown .num{font-size:34px;font-weight:800;color:var(--navy);line-height:1}
.countdown.soon .num{color:var(--orange)}
.countdown.urgent .num{color:var(--alert)}

/* ---------- Forms ---------- */
.field{margin-bottom:12px}
.field>label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field .hint{font-weight:500;color:var(--ink-3);font-size:11.5px}
.input,textarea.input,select.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;color:var(--ink)}
textarea.input{resize:vertical;min-height:80px;line-height:1.7}
.input:focus,textarea.input:focus,select.input:focus{border-color:var(--teal)}
.row2{display:grid;gap:12px}
@media(min-width:560px){.row2{grid-template-columns:1fr 1fr}}
.counter{text-align:right;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.counter.over{color:var(--alert);font-weight:700}
.counter.near{color:var(--warn)}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:30px 18px;color:var(--ink-2)}
.empty .em{font-size:30px;margin-bottom:8px}
.empty h4{font-size:15px;color:var(--ink);margin-bottom:4px}

/* ---------- Bottom nav ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-inner{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:none;background:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-3);font-size:10.5px;font-weight:700}
.tab .ic{font-size:20px;line-height:1}
.tab.active{color:var(--navy)}
.tab.active .ic{transform:translateY(-1px)}

/* ---------- Modal / drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,28,38,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:var(--maxw);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:slideup .25s ease}
@media(min-width:620px){.overlay{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
@keyframes slideup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;position:sticky;top:-16px;background:var(--surface);padding-top:4px}
.sheet-head h3{font-size:17px}
.x{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:17px;color:var(--ink-2);flex:none}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:80;opacity:0;
  box-shadow:0 8px 24px rgba(0,0,0,.2);transition:.28s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--ok)}.toast.warn{background:var(--warn)}.toast.err{background:var(--alert)}

/* ---------- Lists ---------- */
.list-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:none}
.check{width:22px;height:22px;border-radius:7px;border:2px solid #cbd3dc;flex:none;display:grid;place-items:center;cursor:pointer;background:#fff;margin-top:0;position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.checkhit{flex:none;display:flex;align-items:flex-start;padding:3px 7px 9px 0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.check:active{transform:scale(.92)}
.check.on{background:var(--teal);border-color:var(--teal);color:#fff}
.strike{text-decoration:line-through;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0}

.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.searchbar{display:flex;gap:8px;margin-bottom:12px}
.searchbar .input{flex:1}

.note{background:var(--warn-soft);border:1px solid #f0dcc2;color:#7a5320;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6}
.acc summary .badge{white-space:nowrap}
.acc>summary>.smt{flex:1 1 auto;min-width:0;text-align:left;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
/* Notionのトグルのような開閉ブロック */
.tg{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface);overflow:hidden}
.tg>summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--ink)}
.tg>summary::-webkit-details-marker{display:none}
.tg>summary::before{content:"\25B8";flex:none;color:var(--ink-3);font-size:13px;transition:transform .18s;display:inline-block;line-height:1}
.tg[open]>summary::before{transform:rotate(90deg)}
.tg>summary:active{background:var(--surface-2)}
.tg[open]>summary{border-bottom:1px solid var(--line)}
.tg .tg-t{flex:1 1 auto;min-width:0}
.tg .tg-r{flex:0 1 auto;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:800;color:var(--ink-3);text-align:right}
.tg .tg-body{padding:10px 13px 13px}
.tg.tg-orange{border-left:3px solid var(--orange)}
.tg.tg-teal{border-left:3px solid var(--teal)}
.tg.tg-navy{border-left:3px solid var(--navy)}
/* 総合評価の一行サマリーと前回比 */
.dchip{display:inline-block;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;white-space:nowrap}
.dchip.up{background:#e8f5ee;color:#2e8b57}
.dchip.dn{background:#fdecea;color:#b4573f}
.dchip.fl{background:var(--surface-2);color:#8792a2}
.dsm{font-size:10.5px;font-weight:900;margin-left:4px;white-space:nowrap}
.histrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12px}
.histrow:first-child{border-top:0}
.histrow .hd{flex:none;width:96px;color:var(--ink-3);font-size:11px;font-weight:700}
.histrow .hb{flex:1;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.histrow .hb>span{display:block;height:100%;border-radius:99px}
.histrow .hn{flex:none;width:58px;text-align:right;font-weight:900}
.qt{border-left:3px solid var(--orange);background:var(--surface-2);border-radius:0 8px 8px 0;padding:6px 10px;margin:4px 0 8px;font-size:12px;line-height:1.7;color:var(--ink-2)}
.qt b{color:var(--ink);font-weight:700}
.qt .qlbl{display:block;font-size:10px;font-weight:800;color:var(--ink-3);margin-bottom:2px}
.pararow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.pararow:first-of-type{border-top:0}
.parano{flex:none;width:26px;height:26px;border-radius:8px;background:var(--teal-soft);color:#0f6f6b;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.note.info{background:var(--teal-soft);border-color:#c7e7e5;color:#0f6f6b}
.ai-note{background:var(--surface-2);border-left:3px solid var(--teal);border-radius:8px;padding:9px 11px;font-size:12px;color:var(--ink-2)}

.hl-weak{background:#fdeede;border-bottom:2px solid var(--orange);border-radius:3px;padding:0 1px}
.diff-del{background:#fbe9e4;color:#9c4a34;text-decoration:line-through;border-radius:3px;padding:0 2px}
.diff-add{background:#e6f4ec;color:#1f6b43;border-radius:3px;padding:0 2px}

.gradesheet{background:linear-gradient(180deg,#fbfcfd,#f4f7f9);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;margin:8px 0}
.gs-head{display:flex;align-items:center;gap:12px}
.gs-letter{width:64px;height:64px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#fff;letter-spacing:-1px;box-shadow:0 3px 10px rgba(31,41,51,.16)}
.gs-meta{flex:1;min-width:0}
.gs-meta .t{font-size:12px;font-weight:800;color:var(--ink-2)}
.gs-meta .n{font-size:22px;font-weight:900;color:var(--navy);line-height:1.1}
.gs-meta .d{font-size:11px;font-weight:700;margin-top:2px}
.gs-radar{display:flex;justify-content:center;margin:4px 0 2px}
.gs-axes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:2px}
.gs-ax{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:11px;font-weight:700;color:var(--ink-2)}
.gs-ax b{font-size:12px;font-weight:900}
.gs-scale{display:flex;gap:4px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.gs-scale span{font-size:10px;font-weight:700;color:var(--ink-3);background:var(--surface-2);border-radius:99px;padding:2px 7px}
.scorebar{display:flex;align-items:center;gap:9px;margin:7px 0}
.scorebar .lbl{width:92px;font-size:12px;font-weight:700;color:var(--ink-2);flex:none}
.scorebar .track{flex:1;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.scorebar .track>span{display:block;height:100%;border-radius:99px;background:var(--teal)}
.scorebar .val{width:24px;text-align:right;font-size:12px;font-weight:800;color:var(--navy);flex:none}

.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;background:#fbfcfd}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"⌄";color:var(--ink-3);transition:.2s}
.acc[open]>summary::after{transform:rotate(180deg)}
.acc .acc-body{padding:0 14px 14px}

.tag-sm{display:inline-block;background:var(--surface-2);color:var(--ink-2);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600;margin:2px 3px 0 0}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-tile{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.menu-tile .em{font-size:22px}
.menu-tile b{display:block;margin-top:6px;font-size:14px}
.menu-tile span{font-size:11.5px;color:var(--ink-2)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--teal);animation:spin .8s linear infinite;margin:14px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px var(--ok-soft)}

/* ---------- Autocomplete ---------- */
.ac-wrap{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:70;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 26px rgba(20,28,38,.16);max-height:270px;overflow:auto}
.ac-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-size:14px;border-top:1px solid var(--surface-2)}
.ac-item:first-child{border-top:none}
.ac-item:hover,.ac-item.ac-active{background:var(--teal-soft)}
.ac-item .nm{font-weight:600}
.ac-more{padding:8px 12px;font-size:11.5px;color:var(--ink-3);text-align:center;border-top:1px solid var(--surface-2)}
.mode-list{display:grid;gap:8px;margin-bottom:10px}
.mode-card{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.mode-card .mc-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mode-card .mc-ic{font-size:18px}
.mode-card .mc-desc{margin:4px 0 2px;line-height:1.5}
.mode-card.on{border-color:var(--teal);background:var(--teal-soft);box-shadow:0 0 0 2px rgba(0,0,0,.02)}
.mode-card.locked{opacity:.75}
.day-cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-family:inherit}
.day-cell .wd{font-size:10px;color:var(--ink-3)}
.day-cell .dn{font-size:14px;font-weight:800;color:var(--navy);line-height:1}
.day-cell .cnt{font-size:10px;font-weight:700;color:#fff;background:var(--orange);border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.day-cell .cnt.none{background:transparent;color:var(--ink-3);font-weight:600}
.day-cell .pin{font-size:11px}
.day-cell.on{border-color:var(--teal);background:var(--teal-soft)}
.day-cell.dl{border-color:var(--orange)}
.day-cell:hover{border-color:var(--teal)}
.ac-free{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-size:14px;border-top:1px solid var(--surface-2);background:var(--surface-2)}
.ac-free:hover{background:var(--teal-soft)}
.ac-free .nm{font-weight:600;color:var(--ink-2)}
.pw-wrap{position:relative}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:var(--surface-2);color:var(--ink-2);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer}
.pw-toggle:hover{background:#e2e6eb}

/* ---------- プロフィールアイコン（右上） ---------- */
.avatar-btn{width:38px;height:38px;border-radius:50%;flex:none;padding:0;border:2px solid #fff;cursor:pointer;background:transparent;box-shadow:0 2px 8px rgba(31,59,87,.28);position:relative}
.avatar-btn .av-face,.avatar-btn .av-img{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;color:#fff;font-weight:800;font-size:15px;overflow:hidden}
.av-img{background-size:cover;background-position:center;background-repeat:no-repeat}
.avatar-btn.linked::after{content:"";position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid #fff}
.avatar-btn.linked.syncerr::after{background:var(--alert)}
.pmenu-head{display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px 0 14px}
.pmenu-av{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:800;overflow:hidden;box-shadow:0 6px 16px rgba(31,59,87,.3)}
.pmenu-name{font-weight:800;font-size:17px}
.pmenu-mail{font-size:12.5px;color:var(--ink-2)}
.pmenu-list{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:2px}
.pmenu-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px;font-size:14px;font-weight:600;background:#fff;border:0;border-top:1px solid var(--line);cursor:pointer;color:var(--ink)}
.pmenu-row:first-child{border-top:0}
.pmenu-row .pg{width:22px;text-align:center;flex:none}
.pmenu-row .pn{margin-left:auto;color:var(--ink-3);font-size:12px;font-weight:600}
.pmenu-row .pc{margin-left:auto;color:var(--ink-3)}
.pmenu-row .pn~.pc{margin-left:8px}
/* ---------- アイコン編集 ---------- */
.av-prev{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;margin:0 auto 8px;overflow:hidden;box-shadow:var(--shadow)}
.av-prev .av-img{width:100%;height:100%;border-radius:50%}
.av-sw{display:flex;gap:8px;justify-content:center;margin:2px 0}
.av-c{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.av-c.on{border-color:#fff;outline:2px solid var(--navy);outline-offset:1px}
.av-emo{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 2px}
.av-e{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;line-height:1}
.av-e.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--teal-soft)}
/* ---------- 仕上げ ---------- */
.topbar{box-shadow:0 1px 0 rgba(31,41,51,.04),0 8px 20px rgba(31,41,51,.05)}

/* ============================================================
   STORIA リデザイン層 — Apple / Linear 風（余白・タイポ・質感）
   既存クラス名はそのまま、見た目のみ上書き。JSは変更なし。
   ============================================================ */
:root{
  --bg:#F8F9FB; --surface:#FFFFFF; --surface-2:#F1F3F6; --line:#ECEEF2;
  --ink:#111114; --ink-2:#6B7280; --ink-3:#9AA1AC;
  --navy:#111318; --navy-2:#2A2D34;
  --teal:#4F7CFF; --teal-soft:#EEF3FF;
  --orange:#F59E42; --orange-soft:#FDF1E4;
  --ok:#22C55E; --ok-soft:#E9F9EF; --warn:#D97706; --warn-soft:#FBF0E2; --alert:#EF4444;
  --band:#111318; --band-ink:#E9EBF0;
  --shadow:0 1px 2px rgba(17,18,24,.04),0 10px 30px rgba(17,18,24,.06);
  --shadow-lg:0 16px 44px rgba(17,18,24,.12);
  --radius:22px; --radius-s:14px;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',Meiryo,system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
body{background:var(--bg);color:var(--ink);letter-spacing:.01em;line-height:1.72}
h1,h2,h3,h4{letter-spacing:-.012em}
a{color:var(--teal)}
::selection{background:var(--teal-soft)}

.view{padding:22px 18px 14px;animation:vin .4s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-head{margin:6px 0 20px}
.page-head h2{font-size:28px;font-weight:700}
.page-head p{font-size:13.5px;margin-top:6px;color:var(--ink-2)}

.topbar{background:rgba(248,249,251,.72);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.topbar-inner{padding:14px 18px}
.brand{color:var(--ink);gap:11px}
.brand .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(140deg,#4F7CFF,#8A5CF6 58%,#12B6A8);box-shadow:0 4px 14px rgba(79,124,255,.34);position:relative}
.brand .logo::after{content:"✦";position:absolute;inset:0;border:0;transform:none;display:grid;place-items:center;color:#fff;font-size:15px;border-radius:10px}
.brand-txt{display:flex;flex-direction:column;line-height:1.1}
.brand .wm{font-weight:800;font-size:18px;letter-spacing:.16em;background:linear-gradient(120deg,#111318,#4F7CFF 150%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.brand small{font-size:9.5px;color:var(--ink-3);letter-spacing:.02em;margin-top:2px}

.disclaimer{background:var(--band);color:var(--band-ink)}
.disclaimer b{color:#fff}

.card{background:rgba(255,255,255,.78);backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.card.tight{padding:16px}
.card-title{gap:10px;margin-bottom:12px}
.card-title .ic{width:34px;height:34px;border-radius:11px;background:var(--surface-2);font-size:17px}
.card h3{font-size:15.5px;font-weight:650}
@media(hover:hover){.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 17px;font-size:14px;font-weight:600;min-height:44px;transition:transform .2s var(--ease),background .2s,border-color .2s,box-shadow .2s,filter .2s}
.btn:hover{border-color:#dfe3ea;background:var(--surface)}
.btn:active{transform:scale(.965)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--surface);box-shadow:0 6px 18px rgba(17,19,24,.18)}
.btn.primary:hover{background:var(--navy-2);filter:none}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 6px 18px rgba(79,124,255,.28)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.block{width:100%;min-height:52px;border-radius:16px}
.btn.sm{min-height:0;padding:8px 13px;font-size:12.5px;border-radius:11px}
.btn.danger{color:var(--alert);border-color:#f3d6d6;background:transparent}
.btn.danger:hover{background:#fdeeee}

.input,textarea.input,select.input{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;transition:border-color .2s,box-shadow .2s}
.input:focus,textarea.input:focus,select.input:focus{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft);outline:none}
.field>label{font-size:12.5px;color:var(--ink-2)}

.chip{border-radius:999px;padding:6px 12px}
.chip.sel{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.seg{background:var(--surface-2);border-radius:13px;padding:4px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(17,18,24,.1)}
.badge{border-radius:999px}
.badge.navy{background:#EEF0F4;color:var(--ink)}
.badge.teal{background:var(--teal-soft);color:var(--teal)}
.badge.ok{background:var(--ok-soft);color:#16884a}
.badge.alert{background:#FDECEC;color:var(--alert)}

.prog{height:8px;background:var(--surface-2)}
.prog>span{background:var(--teal)}
.countdown .num{font-size:40px;font-weight:800;letter-spacing:-.02em}

.tabbar{background:rgba(248,249,251,.8);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.tab{color:var(--ink-3);font-weight:600;padding:11px 4px 9px}
.tab.active{color:var(--ink)}
.tab .ic{transition:transform .25s var(--ease)}
.tab.active .ic{transform:translateY(-2px)}

.overlay{background:rgba(17,18,24,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,.16);animation:sup .42s var(--ease)}
@media(min-width:620px){.sheet{border-radius:26px}}
@keyframes sup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-head h3{font-size:19px;font-weight:700}
.x{background:var(--surface-2);color:var(--ink-2)}

.tg,.acc,.menu-tile,.mode-card{border-radius:16px}
.menu-tile{box-shadow:var(--shadow);padding:16px}
.acc>summary{background:var(--surface)}
.toast{background:var(--ink);color:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg)}

@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

.skl{background:linear-gradient(100deg,var(--surface-2) 30%,#e9edf3 50%,var(--surface-2) 70%);background-size:200% 100%;animation:shim 1.3s infinite;border-radius:10px}
@keyframes shim{to{background-position:-200% 0}}

/* チュートリアル */
.tut{text-align:center;padding:14px 6px 2px}
.tut-ic{font-size:46px;line-height:1;margin:6px 0 14px}
.tut-t{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}
.tut-d{font-size:14.5px;color:var(--ink-2);line-height:1.85;margin:0 auto;max-width:22em}
.tut-dots{display:flex;gap:7px;justify-content:center;margin-top:20px}
.tut-dot{width:7px;height:7px;border-radius:50%;background:var(--surface-2);transition:.3s var(--ease)}
.tut-dot.on{background:var(--teal);width:22px;border-radius:99px}

/* ---------- ダークモード（システム連動） ---------- */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0C0F; --surface:#161821; --surface-2:#20232C; --line:#2A2E38;
    --ink:#F4F6FA; --ink-2:#A6ACB8; --ink-3:#6E7480;
    --navy:#F4F6FA; --navy-2:#E3E6EC;
    --teal:#6E92FF; --teal-soft:#1A2340;
    --orange:#F0A657; --orange-soft:#2A2213;
    --ok:#34D07A; --ok-soft:#14301F; --warn:#E0A44A; --warn-soft:#2A2213; --alert:#FF6B6B;
    --band:#20232C; --band-ink:#C9CDD6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);
    --shadow-lg:0 18px 46px rgba(0,0,0,.6);
  }
  body{background:radial-gradient(1200px 700px at 50% -20%,#12141b,#0B0C0F 62%)}
  .card{background:rgba(22,24,33,.72)}
  .topbar{background:rgba(11,12,15,.72)} .tabbar{background:rgba(11,12,15,.82)}
  .input,textarea.input,select.input,.check,.seg button.on,.mode-card,.menu-tile,.day-cell,.ac-list,.acc>summary,.tg,.gradesheet{background:var(--surface)}
  .gradesheet{background:linear-gradient(180deg,#181b24,#12141b)}
  .btn{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
  .btn.ghost{background:transparent}
  .btn:hover{background:#2a2e3a}
  .btn.primary{background:var(--navy);color:#111318}
  .btn.teal{color:#0B1220}
  .btn.danger{background:transparent;border-color:#4a2b2b}
  .check{border-color:var(--line)}
  .x,.seg{background:var(--surface-2)}
  .badge.navy{background:#20232C;color:var(--ink)}
  .note{background:#241f14;border-color:#3a3020;color:#e6c98f}
  .qt,.ai-note{background:var(--surface-2)}
  .skl{background:linear-gradient(100deg,#20232C 30%,#2a2e3a 50%,#20232C 70%)}
  .brand .wm{background:linear-gradient(120deg,#F4F6FA,#6E92FF 150%);-webkit-background-clip:text;background-clip:text}
}
.brand .logo.logo-img{background-size:cover;background-position:center;background-repeat:no-repeat}
.brand .logo.logo-img::after{content:none;display:none}
/* ---------- ボトムナビ：オリジナル細線アイコン ---------- */
.tabbar-inner{padding:6px 4px 2px}
.tab{gap:3px}
.tab .ic{display:flex;align-items:center;justify-content:center;width:46px;height:30px;border-radius:13px;transition:background .28s var(--ease),color .2s var(--ease),transform .28s var(--ease)}
.tab .ic svg{width:24px;height:24px;display:block}
.tab .ic svg *{vector-effect:non-scaling-stroke}
.tab.active{color:var(--teal)}
.tab.active .ic{background:var(--teal-soft);color:var(--teal);transform:none}
.tab:active .ic{transform:scale(.9)}
.doclist-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.doclist-row .input{flex:1}
.doclist-x{flex:none;min-height:0;padding:9px 12px;color:var(--ink-3);border-radius:11px}
.doc-ul{margin:2px 0 0;padding-left:1.15em}
.doc-ul li{margin:2px 0}
.pmenu-row.danger{color:var(--alert)}
.pmenu-row.danger .pg{filter:grayscale(1)}
</style>
</head>

<script>
"use strict";
/* =========================================================================
   STORIA — 単一HTML / localStorage / ルールベースAI (デモ)
   ========================================================================= */
const APP_VER='2026.08.11-11';   /* 更新のたびにここを変えてください（利用者に「更新されました」と表示されます） */
const LS_BASE='aoCompass_v1';
const LS_SCOPE_KEY='aoCompass_scope';
/* ログイン中のデータは、アカウントごとの引き出しに入れます。
   こうしておくと、ログアウトしたときにその引き出しだけを空にでき、
   共用の端末でも前の人のデータが見えてしまうことがありません。 */
let LS_SCOPE=(()=>{try{return localStorage.getItem(LS_SCOPE_KEY)||null;}catch(e){return null;}})();
function lsKey(){ return LS_SCOPE?LS_BASE+'__u_'+LS_SCOPE:LS_BASE; }
/* ログインの記録がこの端末に無いのに、アカウントの引き出しだけ残っている場合は開きません
   （通信できないとき・ログイン情報だけ消えたとき・共用端末で前の人が閉じたとき） */
function hasStoredSession(){ try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf('sb-')===0&&k.indexOf('auth-token')>0) return true; } }catch(e){} return false; }
(function(){ if(LS_SCOPE&&!hasStoredSession()){ try{ localStorage.removeItem(LS_BASE+'__u_'+LS_SCOPE); localStorage.removeItem(LS_SCOPE_KEY); localStorage.removeItem('aoCompass_tg'); }catch(e){} LS_SCOPE=null; } })();
const LS_VER='aoCompass_ver';
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
function daysUntil(iso){ if(!iso) return null; const d=new Date(iso+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }
function countJP(s){ return (s||'').replace(/\s/g,'').length; } // 空白を除く文字数
/* 保存したAI分析を「いつの結果か」表示するため */
function fmtDT(ts){ if(!ts) return '—'; const d=new Date(ts); const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`; }
/* 本文が分析時から変わったかを判定するための短い指紋 */
function txtSig(t){ t=String(t||''); let h=0; for(let i=0;i<t.length;i++){ h=(h*31+t.charCodeAt(i))|0; } return t.length+':'+h; }

/* ---------------- State ---------------- */
let S=load();
function blankState(){ return {
  meta:{primarySchoolId:null, demoLoaded:false},
  schools:[], activities:[], documents:[], interview:[], essays:[], tasks:[], feedback:[], certs:[],
  self:{answers:{}, tags:{strengths:[],values:[],activities:[],themes:[],future:[],episodes:[]}},
  story:{origin:'',problem:'',past:'',learned:'',wantLearn:'',whyUniv:'',afterEnroll:'',future:''},
  profile:{name:'',grade:'',school:'',field:'',goal:'',onboarded:false,createdAt:null,avatarColor:0,avatarEmoji:'',avatarPhoto:''},
  prefs:{textSize:'m',alertDays:14,greet:true}
};}
/* 古いバージョンで保存されたデータに、新しく増えた項目を足して読み込む（データは消しません） */
function migrate(raw){
  const D=blankState(); if(!raw||typeof raw!=='object') return D;
  const out=Object.assign(blankState(),raw);
  out.meta=Object.assign({},D.meta,raw.meta||{});
  out.self=Object.assign({},D.self,raw.self||{});
  out.self.answers=Object.assign({},(raw.self&&raw.self.answers)||{});
  out.self.tags=Object.assign({},D.self.tags,(raw.self&&raw.self.tags)||{});
  Object.keys(D.self.tags).forEach(k=>{ if(!Array.isArray(out.self.tags[k])) out.self.tags[k]=[]; });
  out.story=Object.assign({},D.story,raw.story||{});
  out.profile=Object.assign({},D.profile,raw.profile||{});
  out.prefs=Object.assign({},D.prefs,raw.prefs||{});
  ['schools','activities','documents','interview','essays','tasks','feedback','certs'].forEach(k=>{ if(!Array.isArray(out[k])) out[k]=[]; });
  out.schools.forEach(x=>{ if(!x.checklist||typeof x.checklist!=='object') x.checklist={}; if(x.docList!=null&&!Array.isArray(x.docList)) x.docList=[]; });
  out.documents.forEach(d=>{ if(!Array.isArray(d.feedbacks))d.feedbacks=[]; if(!Array.isArray(d.versions))d.versions=[]; if(!d.paragraphNotes||typeof d.paragraphNotes!=='object')d.paragraphNotes={}; if(!Array.isArray(d.scoreHistory))d.scoreHistory=[]; if(d.aiAnalysis&&typeof d.aiAnalysis!=='object')d.aiAnalysis=null; });
  return out;
}
function load(){ try{const r=localStorage.getItem(lsKey());if(r)return migrate(JSON.parse(r));}catch(e){} return blankState(); }
/* 中身がまだ何も無い状態か（初ログイン時の引き継ぎ判定に使います） */
function isEmptyState(x){ if(!x) return true;
  const lists=['schools','activities','documents','interview','essays','tasks','feedback','certs'];
  if(lists.some(k=>Array.isArray(x[k])&&x[k].length)) return false;
  if(x.story&&Object.keys(x.story).some(k=>String(x.story[k]||'').trim())) return false;
  if(x.self&&x.self.answers&&Object.keys(x.self.answers).length) return false;
  if(x.profile&&String(x.profile.name||'').trim()) return false;
  return true; }
/* 更新のお知らせ（データはそのまま残ります） */
function checkVersion(){
  let prev=null; try{ prev=localStorage.getItem(LS_VER); }catch(e){}
  try{ localStorage.setItem(LS_VER,APP_VER); }catch(e){}
  if(prev&&prev!==APP_VER) setTimeout(()=>toast('アプリが最新版に更新されました（'+APP_VER+'）','ok'),900);
}

const SB_URL='https://zamkhvvylqbvwijnkayp.supabase.co';
const SB_ANON='sb_publishable_mZ9GCbvJvbgefBKxgF9T1w_5H4PVFjS';
function cloudConfigured(){ return /^https?:\/\//.test(SB_URL) && typeof SB_ANON==='string' && SB_ANON.length>20; }
let sb=null, sbUser=null, sbStatus='guest', sbSyncTimer=null;
function initCloud(){
  if(!cloudConfigured() || !window.supabase){ updateAuthBar(); return; }
  try{ sb=window.supabase.createClient(SB_URL,SB_ANON); }catch(e){ return; }
  sb.auth.getSession().then(({data})=>{
    if(data&&data.session){ onAuth(data.session.user); }
    else if(LS_SCOPE){ purgeAccountData(false); }   /* ログインが切れていたら、端末に残ったアカウントのデータは見せない */
    updateAuthBar(); });
  sb.auth.onAuthStateChange((event,session)=>{ if(event==='PASSWORD_RECOVERY'){ setTimeout(openPasswordUpdate,300); return; } if(session){ if(!sbUser||sbUser.id!==session.user.id) onAuth(session.user); } else { if(LS_SCOPE) purgeAccountData(false); sbUser=null; sbStatus='guest'; } updateAuthBar(); });
  updateAuthBar();
}
function onAuth(u){
  const carry=(!LS_SCOPE&&!isEmptyState(S))?S:null;   /* ゲストのまま書いていた内容を、初ログイン時だけ引き継ぐ */
  sbUser=u; sbStatus='synced';
  if(LS_SCOPE!==u.id){
    LS_SCOPE=u.id; try{ localStorage.setItem(LS_SCOPE_KEY,u.id); }catch(e){}
    S=load();
    if(carry&&isEmptyState(S)){ S=carry; try{ localStorage.setItem(lsKey(),JSON.stringify(S)); }catch(e){} }
    try{ render(); }catch(e){}
  }
  updateAuthBar(); cloudPull(); try{ refreshEntitlement(); }catch(e){}
}
/* ログアウト時に、このアカウントぶんのデータを端末から消します（クラウドには残ります） */
function purgeAccountData(alsoKey){
  if(LS_SCOPE){ try{ localStorage.removeItem(lsKey()); }catch(e){} }
  LS_SCOPE=null; try{ localStorage.removeItem(LS_SCOPE_KEY); }catch(e){}
  if(alsoKey){ AICFG={}; try{ localStorage.removeItem(AICFG_KEY); }catch(e){} }
  try{ localStorage.removeItem('aoCompass_tg'); }catch(e){}
  sbUser=null; sbStatus='guest'; clearTimeout(sbSyncTimer);
  S=load();   /* ログイン前に使っていたゲストのデータに戻ります */
  updateAuthBar(); try{ render(); }catch(e){}
}
async function doLogout(alsoKey){
  try{ await cloudPush(); }catch(e){}
  try{ if(sb) await sb.auth.signOut(); }catch(e){}
  purgeAccountData(alsoKey);
}
/* アカウント削除：クラウド上のデータ行を消し、サインアウトし、この端末のデータも消します */
async function deleteAccount(){
  if(!sb||!sbUser){ purgeAccountData(true); return {ok:true}; }
  const uidv=sbUser.id; let cloudErr=null;
  try{ const r=await sb.from('app_state').delete().eq('user_id',uidv); if(r&&r.error) cloudErr=r.error; }catch(e){ cloudErr=e; }
  try{ await sb.from('entitlements').delete().eq('user_id',uidv); }catch(e){}
  try{ if(sb) await sb.auth.signOut(); }catch(e){}
  try{ localStorage.removeItem(LS_BASE+'__u_'+uidv); }catch(e){}
  purgeAccountData(true);
  return {ok:!cloudErr, error:cloudErr};
}
async function cloudPull(){
  if(!sb||!sbUser) return;
  try{
    const {data,error}=await sb.from('app_state').select('data').eq('user_id',sbUser.id).maybeSingle();
    if(error){ sbStatus='error'; updateAuthBar(); return; }
    if(data&&data.data){ S=migrate(data.data); localStorage.setItem(lsKey(),JSON.stringify(S)); sbStatus='synced'; render(); toast('クラウドから読み込みました','ok'); }
    else { await cloudPush(); }
  }catch(e){ sbStatus='error'; updateAuthBar(); }
}
async function cloudPush(){
  if(!sb||!sbUser) return;
  sbStatus='syncing'; updateAuthBar();
  try{
    const {error}=await sb.from('app_state').upsert({user_id:sbUser.id, data:S, updated_at:new Date().toISOString()});
    sbStatus=error?'error':'synced';
  }catch(e){ sbStatus='error'; }
  updateAuthBar();
}
function scheduleCloudPush(){ if(!sb||!sbUser) return; sbStatus='pending'; updateAuthBar(); clearTimeout(sbSyncTimer); sbSyncTimer=setTimeout(cloudPush,1500); }

function normEnt(j){ j=j||{}; return {plan:(j.plan==='pro'?'pro':'free'), until:j.until||null, source:j.source||'local'}; }
function loadEnt(){ try{ const r=localStorage.getItem(LS_ENT); if(r) return normEnt(JSON.parse(r)); }catch(e){} return normEnt(null); }

async function refreshEntitlement(){
  if(!sb||!sbUser) return;
  try{
    const {data,error}=await sb.from('entitlements').select('plan,expires_at').eq('user_id',sbUser.id).maybeSingle();
    if(error) return;                       /* テーブル未作成でも無視（無料のまま） */
    if(data){ saveEnt({plan:data.plan,until:data.expires_at||null,source:'cloud'}); render(); }
  }catch(e){}
}
async function redeemCode(code){
  code=String(code||'').trim().toUpperCase();
  if(!code) throw new Error('コードを入力してください。');
  if(!sb||!sbUser) throw new Error('コードの登録にはログインが必要です。先に「ログイン / 新規登録」からログインしてください。');
  const {data,error}=await sb.rpc('redeem_license',{p_code:code});
  if(error) throw new Error(jpLicErr(error));
  const row=Array.isArray(data)?data[0]:data;
  saveEnt({plan:(row&&row.plan)||'pro', until:(row&&(row.expires_at||row.expiresAt))||null, source:'cloud'});
  return ENT;
}
function jpLicErr(e){ const m=((e&&e.message)||'').toLowerCase();
  if(m.includes('見つかり')||m.includes('not found')) return 'コードが見つかりません。大文字・小文字や記号をご確認ください。';

   ルールベースAIコーチ（デモ）— 捏造せず、本人の言葉を引き出す方針

const ABSTRACT_WORDS=['さまざま','様々','いろいろな','色々','たくさん','多くの','しっかり','ちゃんと','頑張った','がんばった','努力した','成長した','コミュニケーション能力','リーダーシップ','主体性','積極的に','一生懸命','貢献したい','役に立ちたい','興味がある','学びたい','グローバル','社会に','貢献','責任感','協調性'];
const FILLER=['と思います','だと思う','のようなもの','など','といった','的な'];
function hasNumbers(t){ return /[0-9０-９]+(人|名|回|時間|日|週間|ヶ月|か月|年|％|%|位|件|校|組|冊|万|千|点|部)/.test(t); }
function detectAbstract(t){ return ABSTRACT_WORDS.filter(w=>t.includes(w)); }
function firstPerson(t){ return /(私は|自分は|私が|自分が|担当し|提案し|企画し|作成し|交渉し|呼びかけ|巻き込)/.test(t); }
/* 指摘を本文に結びつけるため、該当する一文を取り出します */
function splitSent(t){ const out=[]; let cur='';
  String(t||'').split('').forEach(ch=>{ cur+=ch; if(ch==='。'||ch==='！'||ch==='？'||ch==='\n'){ const v=cur.trim(); if(v.length>1) out.push(v); cur=''; } });
  const v=cur.trim(); if(v.length>1) out.push(v); return out; }
function clip(x,n){ x=String(x||'').replace(/\s+/g,' ').trim(); n=n||34; return x.length>n?x.slice(0,n)+'…':x; }
function sentWith(t,word){ const s=splitSent(t).find(x=>x.includes(word)); return s?clip(s):''; }

/* =========================================================================
   良い志望理由書の判断基準
   読んだ人が次の4つすべてに「はい」と答えられる状態が理想です。
     1. なぜその分野に興味を持ったのか分かる
     2. なぜその大学・学部なのか分かる
     3. 大学で何を学びたいのか分かる
     4. 卒業後、その学びをどう生かすのか分かる
   ========================================================================= */
const JUDGE_KEYS=['q1','q2','q3','q4'];
const JUDGE_LABELS={
  q1:'なぜその分野に興味を持ったのか分かる',
  q2:'なぜその大学・学部なのか分かる',
  q3:'大学で何を学びたいのか分かる',
  q4:'卒業後、その学びをどう生かすのか分かる'
};
const JUDGE_HINT={q1:'興味ではなく、問題意識から始まっているか',q2:'他大学に置き換えても成立しないか',q3:'分野名まで落とし込めているか',q4:'将来像が現実的で具体的か'};
/* 「法律」ではなく「国際人権法」まで落とし込めているか、を見るための語 */
const BROAD_FIELDS=['法律','法学','経済','経営','商学','心理','国際','教育','医療','看護','情報','環境','建築','政治','社会','文学','デザイン','農業','スポーツ','福祉','観光','薬','理学','工学','語学','芸術'];
function narrowFields(t){
  const m=String(t||'').match(/[一-龯ァ-ヶー]{2,}(法|学|論|政策|工学|科学|医療|福祉|開発|支援|経済)/g)||[];
  return m.filter(w=>w.length>=4&&!/(大学|学部|学科|進学|入学|独学|中学|高校|通学|見学|在学|同学|科学的)$/.test(w));
}
function rubricSignals(t,ctx){
  t=String(t||''); ctx=ctx||{};
  const school=ctx.school||null; const univName=school?school.name:'';
  return {
    origin:/(きっかけ|契機|出会|体験し|経験した|見たとき|知ったとき|言われた|目の当たり|参加した|訪れた)/.test(t),
    problem:/(課題|問題|疑問|違和感|矛盾|解決|不足|格差|足りな|困って|苦しんで|おかしい|納得できな)/.test(t),
    univRef:/(ゼミ|ゼミナール|研究室|カリキュラム|講義|授業|科目|教授|先生の研究|プログラム|演習|コース|専攻)/.test(t),
    mentionsUniv:!!((univName&&t.includes(univName.replace(/大学$/,'')))||/(貴学|貴学部|貴校|本学部|御校)/.test(t)),
    wantLearn:/(学びたい|研究したい|深めたい|身につけたい|専攻|履修|学ぶ)/.test(t),
    narrow:narrowFields(t),
    future:/(将来|卒業後|進路|なりたい|目指し|キャリア|職に|仕事に)/.test(t),
    concreteFuture:/(弁護士|医師|看護師|教員|教師|研究者|公務員|国際機関|NPO|NGO|企業|法務|記者|建築士|薬剤師|技術者|エンジニア|起業|自治体|省庁|病院|学校現場|支援団体|行政|メーカー|自治会|福祉施設)/.test(t),
    learn:/(学んだ|学びました|気づいた|気付いた|痛感し|実感し|考えるようになっ|分かった|知った)/.test(t),
    likeOnly:/(好き|興味があ|関心があ|楽しかった|面白い|面白かった)/.test(t),
    selfPR:/(強み|長所|得意|自信があ|評価され|リーダーとして|力を発揮)/.test(t)
  };
}
/* 4つの問いに、いまの本文で答えられるかを判定します（オフライン簡易版） */
function judgeOffline(t,ctx){
  const g=rubricSignals(t,ctx);
  const mk=(a,why,fix)=>({a:a,why:why,fix:fix});
  const j={};
  j.q1 = (g.origin&&g.problem) ? mk('yes','きっかけと、そこから生まれた問題意識の両方が読み取れます。','その問題意識を、もう一段だけ絞れます（誰の、どんな困りごとか）。')
       : g.origin ? mk('partly','きっかけは書かれていますが、そこで何を課題だと思ったのかが弱いです。','「〜に違和感を持った」「〜を解決したい」に当たる一文を、きっかけの直後に足してください。')
       : g.problem ? mk('partly','関心の中身はありますが、そう考えるに至った実際の出来事が見当たりません。','ニュースや一般論ではなく、あなたが実際に経験した場面を1つ書いてください。')
       : mk('no','興味の理由が、きっかけからも問題意識からも説明されていません。','①いつ・どこで何があったか ②そこで何が課題だと思ったか、の順に2文足してください。');
  j.q2 = (g.mentionsUniv&&g.univRef) ? mk('yes','大学名と、その大学の学び（授業・ゼミ・教授・研究）の両方に触れています。','その学びが、あなたの課題意識のどこに効くのかまで書けると、さらに強くなります。')
       : g.univRef ? mk('partly','学びの中身には触れていますが、それがこの大学のものだと分かる書き方になっていません。','大学名を出し、公式サイトで確認したゼミ・科目・教授名を1つ挙げてください。')
       : g.mentionsUniv ? mk('partly','大学名は出ていますが、他大学に置き換えても成立する内容です。','「この大学だから」と言える根拠（授業・教授・ゼミ・研究内容）を1つ入れてください。')
       : mk('no','なぜこの大学・学部なのかが書かれていません。','独学や他大学ではなく、この大学だからこそ学べる理由を1段落足してください。');
  j.q3 = (g.wantLearn&&g.narrow.length) ? mk('yes','学びたいことが、分野名まで具体的に書かれています。','その分野の中で、特にどのテーマを扱いたいかまで絞れます。')
       : g.wantLearn ? mk('partly','学びたい意思はありますが、分野が広いままです。','「法律を学びたい」ではなく「国際人権法」「知的財産法」のように、分野名まで落とし込んでください。')
       : mk('no','大学で何を学びたいのかが書かれていません。','学びたい分野名と、その分野を選んだ理由を1〜2文で足してください。');
  j.q4 = (g.future&&g.concreteFuture) ? mk('yes','卒業後にやりたいことが、具体的な場や役割まで書かれています。','その将来のために、大学4年で何を身につけるのかとつなげてください。')
       : g.future ? mk('partly','将来の話はありますが、抽象的です。','「世界平和に貢献したい」ではなく「国際機関で〇〇に携わりたい」のように、場所・相手・手段のどれかを入れてください。')
       : mk('no','卒業後、その学びをどう生かすのかが書かれていません。','最後の段落に、学びを使う場面を1〜2文で足してください。断定でなく現時点の考えで構いません。');
  return j;
}
function judgeYesCount(j){ if(!j) return 0; return JUDGE_KEYS.filter(k=>j[k]&&j[k].a==='yes').length; }
/* 4つの問いを ○△× で表示します。ここが全部○になるのが目標です。 */

/* テキストを設問・大学情報に照らして分析し、8観点スコア＋指摘＋質問を返す */
function analyzeText(text, ctx={}){
  const t=(text||'').trim(); const len=countJP(t);
  const limit=ctx.charLimit||0;
  const abs=detectAbstract(t);
  const num=hasNumbers(t);
  const fp=firstPerson(t);
  const school=ctx.school||null;
  const univName=school?school.name:'';
  const univRef=/(貴学|貴学部|貴校|本学部|御校)/.test(t)&&/(ゼミ|ゼミナール|研究室|カリキュラム|講義|授業|学科|プログラム|教授|先生の研究)/.test(t);
  const mentionsUniv=!!((univName&&t.includes(univName.replace(/大学$/,'')))||univRef);
  const sentences=t.split(/[。\n]/).filter(s=>s.trim().length>0);
  const longSent=sentences.filter(s=>countJP(s)>70);
  // repetition
  const words={}; (t.match(/[一-龯ァ-ヶ]{2,}/g)||[]).forEach(w=>words[w]=(words[w]||0)+1);
  const repeated=Object.entries(words).filter(([w,c])=>c>=4&&w.length>=3).map(([w])=>w).slice(0,3);

  const scores={
    具体性: clamp( (num?35:10)+(fp?25:5)+Math.min(30,len/8) - abs.length*4 ),
    一貫性: clamp( 55 + (ctx.storyLinked?15:0) - (longSent.length*4) ),

function relevanceToQuestion(t,q){
  const keys=(q.match(/[一-龯]{2,}/g)||[]).filter(w=>!['理由','説明','記述','以内','述べ','あなた','ください'].includes(w));

  return 35+Math.round((hit/keys.length)*55);

/* 書類間の一貫性チェック（登録データを横断） */
function consistencyCheck(){
  const issues=[];
  const bodies=S.documents.map(d=>d.body||'');
  const allText=bodies.join('\n')+'\n'+Object.values(S.self.answers||{}).join('\n')+'\n'+S.interview.map(i=>i.answer||'').join('\n');
  // 志望校言及
  const primary=S.schools.find(s=>s.id===S.meta.primarySchoolId);
  if(primary && S.documents.length){
    const short=primary.name.replace(/大学$/,'');
    const missing=S.documents.filter(d=>d.body&&!d.body.includes(short));
    if(missing.length) issues.push({sev:'important',text:`第一志望「${esc(primary.name)}」の固有の理由が書かれていない書類があります（${missing.map(d=>esc(d.title)).join('、')}）。`});
  }
  // 数値の食い違い（活動名が複数書類に出るのに数字が異なる例の簡易検出）
  S.activities.forEach(a=>{
    const usedIn=S.documents.filter(d=>d.body&&a.name&&d.body.includes(a.name.slice(0,4)));
    if(usedIn.length>=2){
      const nums=usedIn.map(d=>(d.body.match(/[0-9０-９]+/g)||[]).join(','));
      if(new Set(nums).size>1) issues.push({sev:'check',text:`活動「${esc(a.name)}」が複数書類に登場します。期間や人数などの数値が一致しているか確認しましょう。`});
    }
  });
  // 強みのばらつき
  const strengths=(S.self.tags.strengths||[]);
  if(strengths.length>4) issues.push({sev:'check',text:`自己分析の「強み」が${strengths.length}個あります。書類ごとに主張する強みがばらつかないよう、中心となる強みを1〜2個に絞ると一貫性が出ます。`});
  if(!issues.length) issues.push({sev:'ok',text:'現時点で大きな矛盾は検出されませんでした。数値・固有名詞・主張する強みが書類間で揃っているか、提出前に自分の目でも確認しましょう。'});
  return issues;
}

/* 提出書類から面接想定質問を生成 */
function genInterviewQuestions(doc){
  const qs=[]; const t=doc.body||'';
  qs.push({cat:'志望理由の深掘り',q:'この書類で書いた志望理由を、1分で口頭で説明してください。'});
  if(hasNumbers(t)) qs.push({cat:'事実確認',q:'文中の数字（規模・期間など）について、もう少し詳しく教えてください。'});
  qs.push({cat:'本人の役割',q:'その活動で、あなた自身が具体的に担当したことは何ですか？'});
  qs.push({cat:'学び・成長',q:'その経験の前と後で、あなたの考え方はどう変わりましたか？'});
  qs.push({cat:'大学での計画',q:'入学後、その関心をどのゼミ・科目でどう深めたいですか？'});
  qs.push({cat:'将来像',q:'その学びを、将来どのように生かしたいですか？'});
  if(detectAbstract(t).length>=2) qs.push({cat:'説明不足の確認',q:'「'+esc(detectAbstract(t)[0])+'」とありますが、具体的にはどういうことですか？'});
  qs.push({cat:'厳しめ',q:'同じ内容は他大学でも言えそうですが、なぜ本学なのですか？'});
  return qs;
}

function fieldAutocomplete(label,val,opts){
  opts=opts||{}; const db=opts.source||[]; const f=el('div','field'); const id='f'+uid();

  let matches=[], active=-1;
  const close=()=>{ list.style.display='none'; inp.setAttribute('aria-expanded','false'); active=-1; };
  const draw=()=>{ list.innerHTML=''; active=-1; const typed=inp.value.trim(); matches=acFilter(db,inp.value); const shown=matches.slice(0,40);
    if(!typed){ close(); return; }

      fr.title='候補になくても、入力した名前でそのまま保存できます';

    else if(e.key==='ArrowUp'){ e.preventDefault(); active=Math.max(active-1,0); }

}

/* =========================================================================
   ファイル読み取り（PDF / Word / パワポ / テキスト）＋書類の種別
   ========================================================================= */
const DOC_TYPES=['志望理由書','自己推薦書','学習計画書','活動報告書','研究計画書','プレゼン資料','小論文','エッセイ','その他'];
function xmlText(s){ return (s||'').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&amp;/g,'&'); }
async function extractFileText(file){
  const name=(file.name||'').toLowerCase(); const ext=name.split('.').pop();
  if(['txt','md','csv','text'].includes(ext)) return {text:await file.text()};
  if(ext==='pptx') return await extractPptx(file);
  if(ext==='docx') return await extractDocx(file);
  if(ext==='pdf') return await extractPdf(file);
  if(['png','jpg','jpeg','gif','webp','heic'].includes(ext)) throw new Error('画像は文字を自動で読み取れません（OCR未対応）。本文をコピーして貼り付けてください。');
  if(['ppt','doc'].includes(ext)) throw new Error('古い形式（.'+ext+'）は未対応です。.pptx / .docx で保存し直すか、本文を貼り付けてください。');
  try{ return {text:await file.text()}; }catch(e){ throw new Error('未対応の形式です（PDF・Word・パワポ・テキストに対応）。'); }
}
async function extractPptx(file){
  if(!window.JSZip) throw new Error('読み取りライブラリを読み込めませんでした（通信環境をご確認ください）。');
  const zip=await window.JSZip.loadAsync(file);
  const names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>(+a.match(/slide(\d+)/)[1])-(+b.match(/slide(\d+)/)[1]));
  const slides=[];
  for(const n of names){ const xml=await zip.files[n].async('string'); const texts=[...xml.matchAll(/<a:t>([\s\S]*?)<\/a:t>/g)].map(m=>xmlText(m[1])).filter(t=>t.trim()); slides.push(texts.join('\n')); }
  if(!slides.length) throw new Error('スライドから文字を取り出せませんでした（画像中心の資料かもしれません）。');
  const text=slides.map((s,i)=>`【スライド${i+1}】\n${s||'（文字なし）'}`).join('\n\n');
  return {text, slides};
}
async function extractDocx(file){
  if(!window.JSZip) throw new Error('読み取りライブラリを読み込めませんでした。');
  const zip=await window.JSZip.loadAsync(file); const f=zip.files['word/document.xml']; if(!f) throw new Error('Word文書を読み取れませんでした。');
  const xml=await f.async('string');
  const paras=xml.split(/<\/w:p>/).map(p=>[...p.matchAll(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)].map(m=>xmlText(m[1])).join('')).filter(t=>t.trim());
  const text=paras.join('\n'); if(!text.trim()) throw new Error('この文書から文字を取り出せませんでした。'); return {text};
}
async function extractPdf(file){
  if(!window.pdfjsLib) throw new Error('PDF読み取りライブラリを読み込めませんでした（通信環境をご確認ください）。');
  try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; }catch(e){}
  const buf=await file.arrayBuffer(); const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  const out=[]; const N=Math.min(pdf.numPages,60);
  for(let i=1;i<=N;i++){ const page=await pdf.getPage(i); const c=await page.getTextContent(); out.push(c.items.map(it=>it.str).join(' ')); }
  const text=out.join('\n');
  if(text.replace(/\s/g,'').length<10) throw new Error('このPDFからは文字を取り出せませんでした（画像化・スキャンPDFの可能性）。本文を貼り付けてください。');
  return {text};
}
function pickFile(accept,onText){
  const inp=el('input'); inp.type='file'; if(accept)inp.accept=accept;
  inp.onchange=async e=>{ const f=e.target.files[0]; if(!f) return; toast('読み取り中…');
    try{ const r=await extractFileText(f); if(!r.text||!r.text.trim()){ toast('文字を取り出せませんでした','warn'); return; } onText(r.text,{slides:r.slides,name:f.name}); }
    catch(err){ toast(err.message||'読み取りに失敗しました','err'); } };
  inp.click();
}

/* ---------- 自動保存（項目ごとに独立したタイマー＋保存状態の表示） ---------- */
const _AS={};
function _hhmm(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function saveStatusEl(){ const e=el('div','save-st'); e.setAttribute('aria-live','polite'); return e; }
function setSaveStatus(node,state){
  if(!node) return;
  node.className='save-st'+(state==='saved'?' ok':(state==='dirty'?' dirty':''));
  node.textContent = state==='saved' ? ('✓ 保存しました（'+_hhmm()+'）') : (state==='dirty' ? '● 未保存の変更があります…' : '');
}
/* ta の内容を key ごとに自動保存する。commit(value) が実際の書き込み。 */
function bindAutosave(ta,key,commit,statusNode,opts){
  opts=opts||{};
  const doSave=(silent)=>{
    const e=_AS[key]; if(e){ clearTimeout(e.t); delete _AS[key]; }
    commit(ta.value);
    save();
    setSaveStatus(statusNode,'saved');
    if(opts.after) try{ opts.after(); }catch(x){}
    if(!silent&&opts.toast) toast(opts.toast,'ok');
  };
  ta.addEventListener('input',()=>{
    setSaveStatus(statusNode,'dirty');
    const e=_AS[key]; if(e) clearTimeout(e.t);
    _AS[key]={t:setTimeout(()=>doSave(true),opts.delay||700),run:()=>doSave(true)};
  });
  ta.addEventListener('blur',()=>{ if(_AS[key]) _AS[key].run(); });
  return doSave;
}
/* 画面を移るとき・アプリを閉じるときに、待機中の保存をすべて確定させる */
function flushAutosave(){ Object.keys(_AS).forEach(k=>{ const e=_AS[k]; if(!e)return; clearTimeout(e.t); try{ e.run(); }catch(x){} }); }
window.addEventListener('pagehide',flushAutosave);
window.addEventListener('beforeunload',flushAutosave);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushAutosave(); });

function docListEditor(container,s){

  function getVals(){ const out=[]; Array.prototype.forEach.call(rows.querySelectorAll('input'),i=>{ const v=i.value.trim(); if(v&&out.indexOf(v)<0) out.push(v); }); return out; }
  function addRow(val){ const row=el('div','doclist-row');
    const inp=el('input','input'); inp.type='text'; inp.setAttribute('list',lid); inp.value=val||''; inp.placeholder='書類名（例：志望理由書）';
    const rm=el('button','btn sm ghost doclist-x','✕'); rm.type='button'; rm.setAttribute('aria-label','この書類を削除');
    rm.onclick=()=>{ rows.removeChild(row); if(!rows.children.length) addRow(''); };
    row.append(inp,rm); rows.appendChild(row); return inp; }
  (init.length?init:['']).forEach(v=>addRow(v));
  const add=el('button','btn sm ghost','＋ 書類を追加'); add.type='button'; add.style.marginTop='2px';
  add.onclick=()=>{ const inp=addRow(''); inp.focus(); }; field.appendChild(add);
  const chipwrap=el('div'); chipwrap.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center';

/* ---- AIの使用量メーター（本物のAIを使った回数と、おおよその料金） ---- */
const USE_KEY='aoCompass_use';
const RATE_KEY='aoCompass_rate';
function useLog(){ try{ const a=JSON.parse(localStorage.getItem(USE_KEY)); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function useSave(a){ try{ localStorage.setItem(USE_KEY,JSON.stringify(a.slice(-400))); }catch(e){} }
function rates(){ const D={in:3,out:15,jpy:155}; try{ const r=JSON.parse(localStorage.getItem(RATE_KEY))||{}; return {in:+r.in>=0?+r.in:D.in,out:+r.out>=0?+r.out:D.out,jpy:+r.jpy>0?+r.jpy:D.jpy}; }catch(e){ return D; } }
function saveRates(r){ try{ localStorage.setItem(RATE_KEY,JSON.stringify(r)); }catch(e){} }
/* 1回ぶんを記録します。トークン数はAIの応答が教えてくれる値を使い、無いときは文字数から概算します */
function recordUsage(prov,model,inTok,outTok,label){
  const a=useLog();
  a.push({at:Date.now(),p:prov||'',m:model||'',i:Math.max(0,Math.round(inTok||0)),o:Math.max(0,Math.round(outTok||0)),l:label||''});
  useSave(a); return a;
}
function usageCost(r,R){ R=R||rates(); return (r.i/1e6)*R.in*R.jpy + (r.o/1e6)*R.out*R.jpy; }
function usageStats(){
  const R=rates(), a=useLog(), now=new Date(), ym=now.getFullYear()+'-'+(now.getMonth()+1);
  const sum=list=>{ const o={n:list.length,i:0,o:0,y:0}; list.forEach(r=>{ o.i+=r.i; o.o+=r.o; o.y+=usageCost(r,R); }); return o; };
  const month=a.filter(r=>{ const d=new Date(r.at); return d.getFullYear()+'-'+(d.getMonth()+1)===ym; });
  return {all:sum(a),month:sum(month),recent:a.slice(-10).reverse(),rate:R};
}
function yen(v){ v=v||0; return '¥'+(v<10?(Math.round(v*10)/10):Math.round(v)).toLocaleString(); }

function profileFields(b,P){

  const sw=el('div','av-sw');

  b.appendChild(sw);
  const emo=el('div','av-emo');
  ['','😀','📚','🎯','🌱','⭐','🎓','🔥','🌸'].forEach(e=>{ const s=el('button','av-e'); s.type='button'; s.textContent=e||'字'; s.title=e||'頭文字'; if(e&&e===draft.avatarEmoji)s.classList.add('on'); s.onclick=()=>{ draft.avatarEmoji=e; draft.avatarPhoto=''; Array.prototype.forEach.call(emo.children,c=>c.classList.remove('on')); s.classList.add('on'); paint(); }; emo.appendChild(s); });
  b.appendChild(emo);
  const file=el('input'); file.type='file'; file.accept='image/*'; file.style.display='none';
  file.onchange=()=>{ const f=file.files&&file.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ const img=new Image(); img.onload=()=>{ try{ const max=160; let w=img.width||1,h=img.height||1; const sc=Math.min(1,max/Math.max(w,h)); w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc)); const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); draft.avatarPhoto=cv.toDataURL('image/jpeg',0.82); Array.prototype.forEach.call(sw.children,c=>c.classList.remove('on')); paint(); }catch(e){ toast('画像を読み込めませんでした','err'); } }; img.onerror=()=>toast('画像を読み込めませんでした','err'); img.src=rd.result; }; rd.readAsDataURL(f); };
  const prow=el('div','btn-row'); prow.style.marginTop='6px';
  const pick=el('button','btn sm ghost','📷 写真を選ぶ'); pick.type='button'; pick.onclick=()=>file.click();
  const clr=el('button','btn sm ghost','写真を外す'); clr.type='button'; clr.onclick=()=>{ draft.avatarPhoto=''; paint(); };
  prow.append(pick,clr); b.appendChild(prow); b.appendChild(file);
  const nm=fieldText('名前（ニックネームでOK）',P.name,'画面の挨拶に使うだけです',{oninput:()=>paint()});
  const gr=fieldSelect('学年',P.grade||'高3',GRADES.map(g=>({value:g,label:g})));
  const hs=fieldCombo('高校名（任意）',P.school,'選んでも、直接入力してもOK',SCHOOL_HINTS);
  const fdOpts=[{value:'',label:'未選択'}].concat(FIELDS.map(x=>({value:x,label:x})));
  if(P.field && FIELDS.indexOf(P.field)<0) fdOpts.push({value:P.field,label:P.field});
  const fd=fieldSelect('興味のある分野（任意）',P.field||'',fdOpts);
  b.append(nm,gr,hs,fd);
  paint();
  return {get:()=>({name:nm.get(),grade:gr.get(),school:hs.get(),field:fd.get(),avatarColor:draft.avatarColor,avatarEmoji:draft.avatarEmoji,avatarPhoto:draft.avatarPhoto})};
}

function suggestSelfTags(){
  const text=Object.values(S.self.answers||{}).filter(Boolean).join(' ');
  let target='themes';
  openSheet('🤖 キーワード候補',(b,close)=>{
    if(!text.trim()){ b.appendChild(el('p','small muted','先に質問へ回答すると、候補を出せます。')); return; }
    b.appendChild(el('div','note','回答文から抜き出した候補です。あてはまるものだけタップして採用してください（AIが勝手に決めません）。もう一度タップすると取り消せます。'));
    /* どのタグに入れるか選べる */
    const sel=fieldSelect('追加先','themes',SELF_TAGS.map(([k,l])=>({value:k,label:l})));
    b.appendChild(sel);
    const box=el('div'); box.style.cssText='display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 10px';
    const cur=el('div','xsmall muted'); cur.style.margin='0 0 8px';
    /* 候補の抽出：漢字・カタカナの語 ＋ 「〜すること」などの名詞句 */
    const cands=(text.match(/[一-龯]{2,}|[ァ-ヶー]{3,}|[A-Za-z]{4,}/g)||[]);
    const NG=['自分','経験','活動','思う','考え','大学','高校','学校','今回','機会','以上','時間','部分','必要','一番','最後','最初','自身','人間','日本','内容','相手','結果','理由','気持'];
    const freq={}; cands.forEach(w=>{ if(w.length<2||NG.includes(w))return; freq[w]=(freq[w]||0)+1; });
    const top=Object.entries(freq).sort((a,b)=>(b[1]-a[1])||(b[0].length-a[0].length)).slice(0,16).map(x=>x[0]);
    if(!top.length){ b.appendChild(el('p','small muted','候補を抽出できませんでした。回答をもう少し書き足すと候補が出ます。')); return; }
    const list=()=>{ S.self.tags[target]=S.self.tags[target]||[]; return S.self.tags[target]; };
    const label=()=>{ const f=SELF_TAGS.find(x=>x[0]===target); return f?f[1]:'タグ'; };
    const drawCur=()=>{ const a=list(); cur.textContent='いまの「'+label()+'」：'+(a.length?a.join('・'):'（未登録）'); };
    const draw=()=>{
      box.innerHTML='';
      top.forEach(t=>{
        const on=list().includes(t);
        const c=el('button','chip chip-btn click'+(on?' sel':''),esc(t)+(on?' ✓':' ＋'));
        c.type='button';
        c.onclick=()=>{
          const a=list(); const i=a.indexOf(t);
          if(i>=0){ a.splice(i,1); save(); toast('「'+label()+'」から外しました','ok'); }
          else { a.push(t); save(); toast('「'+label()+'」に追加しました','ok'); }
          draw(); drawCur();
        };
        box.appendChild(c);
      });
    };
    sel.querySelector('select').onchange=e=>{ target=e.target.value; draw(); drawCur(); };
    b.appendChild(cur); b.appendChild(box); draw(); drawCur();
    const done=el('button','btn primary block','完了（画面に反映）'); done.onclick=()=>{ close(); render(); toast('タグを更新しました','ok'); };
    b.appendChild(done);
  });
}

const PLAN_CAP=3;

  sprint:{id:'sprint',icon:'🔥',name:'直前詰め込みプラン',sub:'〜6週間',cap:5,pro:true,
    desc:'締切が近い人向け。提出必須の手続きと書類の完成だけに絞り、1日あたりの件数を増やして間に合わせます。'}

function planMode(){ const m=S.meta&&S.meta.planMode; return PLAN_MODES[m]?m:recommendMode(); }
function isoAdd(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function isoBefore(iso,n){ return isoAdd(iso,-n); }
function planSchools(){ return S.schools.filter(s=>s.deadline&&daysUntil(s.deadline)!=null&&daysUntil(s.deadline)>=0).sort((a,b)=>daysUntil(a.deadline)-daysUntil(b.deadline)); }
/* 出願年（未設定なら、11月以降は翌年の秋を想定） */
function examYear(){ const y=S.meta&&S.meta.examYear; if(y) return +y; const d=new Date(); return d.getMonth()>=10?d.getFullYear()+1:d.getFullYear(); }
/* 前年度の締切が分かればその日付の翌年、なければ総合型選抜で多い「10月上旬」を概算に使う */
function estDeadline(s){
  const y=examYear(), base=s&&s.lastDeadline;
  if(base&&/^\d{4}-\d{2}-\d{2}$/.test(base)) return String(y)+base.slice(4);
  return String(y)+'-10-01';
}
/* 逆算の対象。長期モードでは締切未登録の志望校も概算日で対象にする */
function planTargets(mode){
  const out=[];
  S.schools.forEach(s=>{
    if(s.deadline&&daysUntil(s.deadline)!=null&&daysUntil(s.deadline)>=0) out.push({s:s,D:s.deadline,est:false});
    else if(mode==='long'&&!s.deadline) out.push({s:s,D:estDeadline(s),est:true});
  });
  return out.sort((a,b)=>a.D.localeCompare(b.D));
}
function planHorizon(mode){ const t=planTargets(mode)[0]; return t?t.D:estDeadline(null); }
function planIsEstimated(mode){ const t=planTargets(mode); return (!t.length)||t.every(x=>x.est); }
function recommendMode(){
  const real=planSchools()[0];
  if(!real){ const dd=daysUntil(estDeadline(null)); return (dd!=null&&dd>=170)?'long':'mid'; }
  const dd=daysUntil(real.deadline);
  if(dd>=170) return 'long';
  if(dd<=45) return 'sprint';
  return 'mid';
}

];
const PLAN_PRIO={'出願':1,'書類':2,'面接':3,'小論文':4,'自己分析':5,'情報収集':6,'探究':7,'資格':7,'学業':7,'振り返り':8};

/* 長期モードの土台づくり（今日 〜 締切の約4ヶ月前まで、週ごとのリズム） */
const LONG_WEEKLY=[
  ['興味のある分野の本・記事を1つ読み、要点と自分の考えを残す','探究','志望理由の「深さ」は、この積み重ねで決まります。'],
  ['今の活動を記録に追加する（やったこと・工夫・変化）','自己分析','あとから思い出すのは大変。その都度が一番正確です。'],
  ['大学・学部を1つ調べ、学べる内容と先生の研究を書き出す','情報収集','比べるほど「なぜこの大学か」が具体的になります。'],
  ['自己分析の設問を1つ選び、いまの言葉で書き足す','自己分析','同じ問いに何度も答えるほど言葉が磨かれます。'],
  ['探究テーマで調べたことを400字にまとめる','探究','書く筋力は、短い文章の反復でつきます。'],
  ['オープンキャンパス・説明会の日程を確認し、予定に入れる','情報収集','参加した記録はそのまま出願書類の材料になります。'],
  ['英語資格（英検・TOEFLなど）の次の受験日を確認する','資格','スコアは出願条件になることが多く、早めが有利です。'],
  ['次の定期テストに向けて計画を立てる','学業','評定平均はあとから取り返せません。']
];
function addLongFoundation(add,mode,end){
  const T=todayISO(); const bridge=isoBefore(end,120);
  if(bridge<=isoAdd(T,3)) return;              /* 4ヶ月を切っていれば土台フェーズは作らない */
  add(isoAdd(T,1),'出願までの全体像を確認し、いまの立ち位置を書き出す','振り返り',null,'長期戦は「現在地」を決めるところから。');
  add(isoAdd(T,2),'前年度の募集要項を入手し、必要書類と日程を書き出す','情報収集',null,'日程はほぼ毎年同じ時期。前年度が最良の予習です。');
  let k=0;
  for(let n=4;n<3000;n+=7){
    const d=isoAdd(T,n); if(d>=bridge) break;
    const w=LONG_WEEKLY[k%LONG_WEEKLY.length]; k++;
    add(d,w[0],w[1],null,w[2]);
    if(k%4===0) add(isoAdd(d,3),'この1ヶ月を振り返り、伸びた点と次の課題を1行で書く','振り返り',null,'月に一度の棚卸しが、書類のネタ帳になります。');
    if(k%12===0) add(isoAdd(d,5),'英語資格を受験する（または申し込む）','資格',null,'出願前にスコアを確定させておきます。');
    if(k>200) break;
  }
  add(isoBefore(end,150),'志望理由書に使えそうな経験を書き出し、材料を1枚にまとめる','自己分析',null,'ここから仕上げフェーズに入ります。');
}

/* ルールベースの逆算エンジン */
function buildPlan(mode){
  mode=PLAN_MODES[mode]?mode:planMode();
  const M=PLAN_MODES[mode], cap=M.cap;
  const today=todayISO(); const raw=[];
  const add=(ideal,title,category,school,why,hard,prioOv)=>{ if(!ideal) return; raw.push({ideal:ideal,title:title,category:category,schoolId:school?school.id:null,why:why||'',hard:!!hard,prio:(hard?0:(prioOv!=null?prioOv:(PLAN_PRIO[category]||9)))}); };
  const targets=planTargets(mode);
  const end=planHorizon(mode);
  if(mode==='long') addLongFoundation(add,mode,end);
  targets.forEach(t=>{
    const s=t.s, D=t.D, dd=daysUntil(D), cl=s.checklist||{}, sn=shortName(s.name);
    if(dd==null||dd<0) return;
    const at=n=>isoBefore(D,n);
    const f=(mode==='sprint')?Math.min(1,Math.max(0.3,(dd-1)/36)):Math.min(mode==='long'?1.6:1.5,Math.max(dd,7)/45);
    const scale=v=>Math.max(1,Math.round(v*f));
    // --- 出願手続き（日付を動かせない作業） ---
    if(!cl.mail) add(at(scale(2)),sn+'：出願書類を発送・提出する','出願',s,'締切当日の投函は事故のもと。2日前には発送を。',true);
    if(!cl.web)  add(at(scale(6)),sn+'：Web出願の登録・入力を終える','出願',s,'システム混雑や入力不備の修正時間を確保。',true);
    if(!cl.fee)  add(at(scale(6)),sn+'：検定料を支払う','出願',s,'振込の反映に数日かかる場合があります。',true);
    if(!cl.photo)add(at(scale(20)),sn+'：証明写真を撮影する','出願',s,'撮り直し・焼き増しの余裕を見て早めに。');
    if(!cl.gpa)  add(at(scale(28)),sn+'：調査書・推薦書を先生に依頼する','出願',s,'学校での発行に2〜3週間かかることがあります。',mode==='sprint');
    if(!cl.eng)  add(at(scale(32)),sn+'：英語資格のスコア証明書を取り寄せる','出願',s,'発送に日数がかかります。');
    if(!cl.req){ const reqD=at(scale(40)); add(reqD>isoAdd(today,3)?isoAdd(today,3):reqD,sn+'：募集要項を読み、必要書類を書き出す','出願',s,t.est?'日程は概算です。要項が出たら実際の日付に更新を。':'ここが逆算の起点。提出物の抜けを防ぎます。'); }
    // --- 書類（量と進捗から必要な作業日数を計算） ---
    let docs=S.documents.filter(d=>d.schoolId===s.id&&d.status!=='完成');
    const anyDoc=S.documents.some(d=>d.schoolId===s.id);
    if(!docs.length&&!cl.doc_ao&&!anyDoc) docs=[{id:null,title:'志望理由書',type:'志望理由書',body:'',charLimit:0,status:'未着手',_virtual:true}];
    docs.slice(0,4).forEach((d,di)=>{
      const nm=d.title.length>12?d.title.slice(0,12)+'…':d.title;
      const rem=docRemaining(d);
      const sessions=Math.min(4,Math.max(1,Math.ceil(rem/(mode==='sprint'?800:500))));
      const off=di*2;
      if(d._virtual||!countJP(d.body||'')) add(at(scale(36)-off),nm+'：書く材料と構成（骨子）を決める','書類',s,'いきなり書かず、経験→学び→志望の順に並べる。');
      for(let i=0;i<sessions;i++){
        const perc=Math.round((i+1)/sessions*100);
        add(at(scale(32)-i*2-off),nm+'：初稿を書く（'+perc+'%まで）','書類',s,(d.charLimit?('残り約'+rem+'字／'+sessions+'回に分けて書く'):'一度に完成させず分けて書く'));
      }
      add(at(scale(26)-off),nm+'：通して読み返し、抽象語を具体に直す','書類',s,'「頑張った」「様々な」を事実と数字に置き換える。');
      add(at(scale(25)-off),nm+'：AI分析で具体性・一貫性をチェックする','書類',s,'指摘は自分の言葉で直す。');
      add(at(scale(23)-off),nm+'：先生・塾に添削を依頼する','書類',s,mode==='sprint'?'時間がないので「いつまでに返してほしいか」も伝える。':'返却まで1週間ほど見込む。');
      add(at(scale(17)-off),nm+'：添削の指摘を反映して直す','書類',s,'受けた指摘はフィードバック画面に記録。');
      if(mode!=='sprint') add(at(scale(12)-off),nm+'：声に出して読み、字数を調整する','書類',s,'読みにくい所は文が長すぎるサイン。');
      add(at(scale(9)-off),nm+'：最終チェックを先生に依頼する','書類',s,'提出前の最後の確認。');
      add(at(scale(4)-off),nm+'：誤字・字数・様式を最終確認する','書類',s,'名前・受験番号・記入欄の抜けも確認。',mode==='sprint');
      /* ここから：「完成」にするまで、繰り返し手を入れる予定を入れ続ける */
      if(di<3){
        const step=(mode==='sprint')?2:(mode==='mid'?3:5);
        const maxN=Math.max(12,Math.min(scale(30),dd-1));
        const cnt=(mode==='sprint')?8:(mode==='long'?14:12);
        let ri=0;
        for(let n=maxN;n>=5&&ri<cnt;n-=step){
          const r=DOC_REVISE[(ri+di*3)%DOC_REVISE.length]; ri++;
          add(at(Math.max(3,n-off)),nm+'：推敲する（'+r[0]+'）','書類',s,'完成するまで、少しずつでも毎回手を入れます。'+r[1],false,12);
        }
      }
    });
    // --- 面接 ---
    if(!cl.mensetsu){
      add(at(scale(30)),sn+'：想定質問を10問書き出す','面接',s,'書類から聞かれそうな所を先に洗い出す。');
      if(mode!=='sprint'){ for(let n=Math.min(scale(26),dd); n>=8; n-=7) add(at(n),sn+'：面接練習（3問・録音して振り返り）','面接',s,'週1回のペースで慣らす。'); }
      else { for(let n=Math.min(scale(20),dd); n>=8; n-=4) add(at(n),sn+'：面接練習（3問・録音して振り返り）','面接',s,'短期間なので回数を増やして慣らす。'); }
      [6,4,2].forEach(n=>{ if(dd>=n) add(at(n),sn+'：面接の直前練習（本番想定で通し）','面接',s,'入退室・第一声まで通しで。'); });
    }
    // --- 小論文 ---
    const needEssay=(S.essays&&S.essays.length)||/小論文|論述|作文/.test(String(s.selection||'')+String(s.docs||''));
    if(needEssay){ const step=(mode==='sprint')?6:10; for(let n=Math.min(scale(35),dd); n>=5; n-=step) add(at(n),sn+'：小論文を1本書いて時間を計る','小論文',s,'本番と同じ字数・時間で。'); }
  });
  // --- 全体（志望校によらない土台づくり）。直前モードでは省く ---
  const nearest=targets[0];
  if(nearest&&mode!=='sprint'){
    const dd0=daysUntil(nearest.D);
    const T0=today;
    const soon=n=>{ const d=isoAdd(T0,n); return d<nearest.D?d:isoAdd(T0,1); };
    const un=selfUnanswered();
    if(un>0){ add(soon(1),'自己分析の設問に答える（残り'+un+'問）','自己分析',null,'書類のネタはここから出ます。'); if(un>4) add(soon(4),'自己分析のつづき（残りの設問を埋める）','自己分析',null,'1日3問ずつでも進みます。'); }
    if(!(S.activities&&S.activities.length)) add(soon(2),'活動をポートフォリオに登録する','自己分析',null,'自分が何をして何が変わったかを記録。');
    if(!(S.story&&S.story.origin)) add(soon(5),'原体験から将来像までのストーリーを整理する','自己分析',null,'一本の筋が通ると書類も面接もぶれません。');
    if(mode==='mid'){ for(let n=7;n<Math.max(0,dd0-25);n+=14) add(soon(n),shortName(nearest.s.name)+'：公式サイト・説明会情報を確認する','情報収集',nearest.s,'変更点や追加資料の告知を見落とさない。'); }
  }
  // --- 日付の正規化：過去は今日以降へ詰め、1日あたりの件数を分散 ---
  raw.sort((a,b)=>a.ideal.localeCompare(b.ideal)||a.prio-b.prio);
  const perDay={}; const seen=new Set(); const items=[];
  raw.forEach(it=>{
    let d=it.ideal<today?today:it.ideal;
    const limit=(()=>{ const t=targets.find(x=>x.s.id===it.schoolId); return t?t.D:isoAdd(it.ideal,21); })();
    if(!it.hard){ let g=0; while((perDay[d]||0)>=cap&&d<limit&&g<60){ d=isoAdd(d,1); g++; } }
    if(!it.hard&&(perDay[d]||0)>=cap+2) return;   /* 溢れる分は諦める（詰め込みすぎない） */
    const key=it.title+'@'+d; if(seen.has(key)) return; seen.add(key);
    perDay[d]=(perDay[d]||0)+1;
    items.push({date:d,title:it.title,category:it.category,schoolId:it.schoolId,why:it.why});
    });
  items.sort((a,b)=>a.date.localeCompare(b.date));
  return items.slice(0,mode==='long'?420:260);
}

/* AIに日割りを組み直してもらう（登録情報のみを根拠にする） */
function planContext(){
  const L=[]; L.push('【今日】'+todayISO());
  planSchools().forEach(s=>{
    const cl=s.checklist||{}; const labels={req:'募集要項の確認',gpa:'調査書・評定',doc_ao:'志望理由書',doc_katsu:'活動報告書',eng:'英語資格',photo:'証明写真',web:'Web出願登録',fee:'検定料',mail:'郵送・提出',mensetsu:'面接練習'};
    const todo=Object.keys(labels).filter(k=>!cl[k]).map(k=>labels[k]);
    L.push(`【志望校】${s.name} ${s.faculty||''} ${s.dept||''} ／方式:${s.method||'—'} ／出願締切:${s.deadline}（あと${daysUntil(s.deadline)}日）／未完了:${todo.join('・')||'なし'}／選考:${(s.selection||'—').slice(0,80)}／必要書類:${(s.docs||'—').slice(0,120)}`);
  });
  S.documents.forEach(d=>{ L.push(`【書類】${d.title}（${d.type||'—'}）状態:${d.status}／現在${countJP(d.body||'')}字${d.charLimit?'／上限'+d.charLimit+'字':''}／志望校:${schoolName(d.schoolId)||'未設定'}`); });
  const iv=S.interview||[]; L.push(`【面接】登録質問${iv.length}問／未回答${iv.filter(q=>!q.answer).length}問／苦手${iv.filter(q=>q.weak).length}問`);
  L.push(`【小論文】練習${(S.essays||[]).length}本`);
  L.push(`【自己分析】未回答${selfUnanswered()}問／ストーリー${(S.story&&S.story.origin)?'記入あり':'未記入'}／活動${(S.activities||[]).length}件`);
  const manual=S.tasks.filter(t=>!t.auto&&!t.done).slice(0,20);
  if(manual.length) L.push('【自分で登録済みのタスク（重複させない）】'+manual.map(t=>(t.due||'期限なし')+' '+t.title).join(' / '));
  return L.join('\n');
}
async function runPlanAI(){
  const mode=planMode(); const tg=planTargets(mode); const last=tg.length?tg[tg.length-1]:null;
  const MM=PLAN_MODES[mode];
  const sys=AI_RULES+'\n\nあなたは出願までの学習計画を設計します。登録された締切・書類の進み具合から逆算し、日付ごとの行動をJSONだけで出力してください（前後に文章やコードブロックを付けない）。'
   +'\n形式：{"plan":[{"date":"YYYY-MM-DD","title":"その日にやること","category":"書類|面接|小論文|出願|自己分析","school":"志望校名または空文字","why":"30字以内の理由"}]}'
   +'\nルール：'
   +'\n・日付は今日以降、各志望校の出願締切以前にする。締切日そのものに作業を置かない。'
   +'\n・毎日詰め込まず、休みの日を作る。合計は120件まで。'
   +'\n・郵送・Web出願・検定料は締切の2〜6日前までに終える配置にする。調査書・推薦書の依頼は3〜4週間前。'
   +'\n・登録されている志望校名・書類名だけを使う。存在しない大学・書類・イベントを作らない。'
   +'\n・titleは25字以内で、その日に何をするかが分かる具体的な行動にする（「頑張る」のような曖昧な表現は不可）。'
   +'\n・締切が近く時間が足りない場合は、量を増やすのではなく優先順位の高いものだけを残す。'
   +'\n・今回のプランの方針：「'+MM.name+'（'+MM.sub+'）」— '+MM.desc+' 1日あたりの上限は'+MM.cap+'件。';
  const raw=await callAI(sys,planContext(),{json:true,max:3000});
  const j=extractJSON(raw); const arr=(j&&(j.plan||j.items||j.tasks))||(Array.isArray(j)?j:null);
  if(!arr||!arr.length) throw new Error('プランをうまく作れませんでした。もう一度お試しください。');
  const today=todayISO(); const maxDate=last?last.D:isoAdd(today,180);
  const out=[];
  arr.forEach(x=>{
    const date=String(x.date||'').slice(0,10); const title=String(x.title||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!title) return;
    if(date<today||date>maxDate) return;
    const sc=S.schools.find(s=>x.school&&s.name.indexOf(String(x.school).replace(/（.*?）/g,''))>=0);
    out.push({date,title:title.slice(0,60),category:String(x.category||'').slice(0,8),schoolId:sc?sc.id:null,why:String(x.why||'').slice(0,60)});
  });
  if(!out.length) throw new Error('日付が正しく作れませんでした。ルールベースのプランをご利用ください。');
  out.sort((a,b)=>a.date.localeCompare(b.date));
  return out.slice(0,90);
}
function applyPlan(items,mode){
  S.tasks=S.tasks.filter(t=>!(t.auto&&!t.done));
  if(mode) S.meta.planMode=mode;
  items.forEach(it=>S.tasks.push({id:uid(),title:it.title,due:it.date,category:it.category||'',schoolId:it.schoolId||null,why:it.why||'',auto:true,done:false}));
  S.meta.planAt=Date.now(); save();
}

/* =====================================================================

const REQ_DOC_PATTERNS=[

  ['自己推薦書',/自己推薦|自己PR|自己ＰＲ|自己アピール|推薦書\(自己/],

function normDocName(x,keepName){
  var v=String(x||'')
    .replace(/[（(【\[][^）)】\]]*[）)】\]]/g,'')
    .replace(/^[\s\u30000-9０-９①-⑳ⅰ-ⅹA-Za-zＡ-Ｚ.．,、・:：\-ー–—>＞●○◎■□☆★*＊\)）\]］]+/,'')

  v = keepName ? v.replace(/(など|等|以上)$/,'') : v.replace(/(の提出|を提出|提出|が必要|必要|必須|など|等|以上)$/,'');

/* 表記ゆれを代表的な名前にそろえる（同じ書類が二重に出ないように） */
function canonDoc(v){
  for(var i=0;i<REQ_DOC_PATTERNS.length;i++){ if(REQ_DOC_PATTERNS[i][1].test(v)) return REQ_DOC_PATTERNS[i][0]; }

/* よく知られた「本人が書く書類」かどうか（自己推薦書のように除外語と字が重なるものを守る） */
function knownDoc(v){
  for(var i=0;i<REQ_DOC_PATTERNS.length;i++){ if(REQ_DOC_PATTERNS[i][1].test(v)) return true; }
  return false;

function splitDocs(txt){

/* 学校ごとに「本人が書く必要のある書類」を洗い出す（欄に書いたものは全部見る） */
function requiredDocs(s){
  if(!s) return [];
  const out=[]; const seen={};
  const push=function(v,explicit){
    if(!v) return;
    if(v.length<2||v.length>28) return;
    const c=canonDoc(v);
    /* 「自己推薦書」のように、よく知られた書類名なら除外語に当たっても必ず残す */
    if(!knownDoc(v) && DOC_SKIP.test(v)) return;
    if(explicit){
      /* 必要書類の欄に書いたものは書式にかかわらず拾う。ただし明らかな注記文は除く */
      if(/(その他|そのほか|以下のいずれ|大学が指定|各自|下記|上記|については|に関して|参照|詳細は|ください|下さい|注意|など$)/.test(v)) return;
    } else {
      /* 選考方法などの文章からの推定は、書類らしい語を含むものだけ */
      if(!/[書票文案資料シート論文計画報告記述作文エッセイレポートプレゼンスライドカード]/.test(c)) return;

  const txt=[s.docs,s.selection,s.method,s.notes,s.eligibility].filter(Boolean).join(' ');
  REQ_DOC_PATTERNS.forEach(function(pair){ if(pair[1].test(txt)) push(pair[0]); });   /* 文章の中に混ざっていても拾う */
  if(!seen['志望理由書']){ out.push('志望理由書'); seen['志望理由書']=1; }   /* 総合型選抜の中心。要項未入力でも必ず見る */
  const i=out.indexOf('志望理由書'); if(i>0){ out.splice(i,1); out.unshift('志望理由書'); }   /* 中心の書類を先頭に */
  return out;
}
/* その書類が今どこまで進んでいるか */
function docProgress(s,label){
  const key=String(label).replace(/書$/,'');

  const hit=ds.filter(d=>d.type===label||(d.title&&d.title.indexOf(key)>=0)||(d.type&&d.type.indexOf(key)>=0));

  if(!len) return {state:'empty',doc:best,len:0};

      schoolId:r.school.id
